  /* new-user tour */
  .tour-ov{position:fixed;inset:0;z-index:9350;background:rgba(8,16,12,.55);}   /* no blur: the highlighted button must stay sharp and readable */
  .tour-box{position:absolute;border-radius:12px;box-shadow:0 0 0 4px rgba(244,212,98,.95),0 0 26px rgba(244,212,98,.35);transition:all .28s cubic-bezier(.16,.8,.32,1);pointer-events:none;}
  .tour-card{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);width:min(440px,92vw);background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:0 26px 60px rgba(0,0,0,.4);animation:cpalIn .25s cubic-bezier(.16,.8,.32,1);}
  .tour-card h3{margin:0 0 6px;font-size:1.12rem;color:var(--green);}
  .tour-card p{margin:0 0 14px;font-size:.92rem;line-height:1.55;color:var(--ink);}
  .tour-btns{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;}
  .tour-dots{display:flex;gap:5px;align-items:center;margin-right:auto;}
  .tour-dot{width:7px;height:7px;border-radius:50%;background:var(--line);}
  .tour-dot.on{background:var(--green);transform:scale(1.3);}
  /* changelog drag-to-reorder */
  .cl-wrap.dragging{user-select:none;}
  .cl-item.drag-src{opacity:.35;}
  .cl-item.drag-over{box-shadow:inset 0 3px 0 var(--green);}

  .cl-handle svg{width:15px;height:15px;}

  .cl-orderbtns{display:inline-flex;flex-direction:column;gap:1px;margin-left:6px;}
  .cl-ob{width:24px;height:20px;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:6px;cursor:pointer;font-size:.62rem;line-height:1;display:flex;align-items:center;justify-content:center;padding:0;}
  .cl-ob:hover{color:var(--green);border-color:var(--green);}

  @media (prefers-reduced-motion:reduce){.pw-fill,.netchip,.tour-box{transition:none;}}
  @media print{#boot{display:none;}}

  /* Final avatar-initial override: every fallback letter inside a profile picture is solid white. */
  .pf-ava,.pf-ava .pf-initial,.pf-ava .av-letter,.avatar .av-letter,.cinit,.mp-init,.pc-noimg,.ld-pav .av-letter{

  .ld-chat-avatar,.ld-chat-fallback{width:36px;height:36px;min-width:36px;border-radius:50%;object-fit:cover;flex:none;box-shadow:0 1px 3px rgba(0,0,0,.12);}

  .ld-act,.ld-del{width:30px;height:30px;justify-content:center;border-radius:9px;transition:background .14s ease,color .14s ease;}

function toast(m,type){                       // stacked toasts with icons (they pile up instead of replacing each other)
  const box=document.getElementById('toasts'); if(!box){ return; }
  const ic=(type==='err')?ICONS.info:((type==='info')?ICONS.globe:ICONS.leaf);
  const t=document.createElement('div'); t.className='toast-item t-'+(type||'ok');
  const i=document.createElement('span'); i.className='ti-ic'; i.innerHTML=ic;
  const s=document.createElement('span'); s.textContent=m;
  t.appendChild(i); t.appendChild(s); box.appendChild(t);
  setTimeout(function(){ t.classList.add('out'); setTimeout(function(){ if(t.parentNode)t.remove(); },280); },2600);
}

// generic add/edit form built from a field spec
let _ed=null,_edImgs={};
function openEditor(title, fields, values, onSave){
  _ed={fields,onSave}; _edImgs={};
  if(values) fields.filter(f=>f.type==='image').forEach(f=>{ if(values[f.key])_edImgs[f.key]=values[f.key]; });
  const body=fields.map(f=>{
    const v=(values&&values[f.key]!=null)?values[f.key]:'';
    const lab='<label>'+esc(f.label)+'</label>';
    if(f.type==='textarea') return lab+'<textarea id="ed-'+f.key+'" rows="3" placeholder="'+escA(f.placeholder||'')+'">'+esc(v)+'</textarea>';
    if(f.type==='select') return lab+'<select id="ed-'+f.key+'" class="ed-select">'+(f.options||[]).map(o=>'<option'+((v||f.options[0])===o?' selected':'')+'>'+esc(o)+'</option>').join('')+'</select>';
    if(f.type==='image') return lab+'<label class="btn btn-ghost btn-sm filebtn">'+ICONS.image+'<span>Choose an image</span><input id="ed-'+f.key+'" type="file" accept="image/*"></label><div class="img-prev" id="edp-'+f.key+'">'+(v?'<img src="'+escA(v)+'">':'')+'</div>';
    const t=f.type==='date'?'date':f.type==='time'?'time':f.type==='url'?'url':'text';
    return lab+'<input id="ed-'+f.key+'" type="'+t+'" value="'+escA(v)+'" placeholder="'+escA(f.placeholder||'')+'">';
  }).join('');
  openModal('<button class="x" onclick="closeModal()" aria-label="Close">×</button><h3>'+esc(title)+'</h3><div class="ed">'+body+'</div><p class="err" id="ed-err"></p><button class="btn btn-primary" style="width:100%;margin-top:8px" onclick="submitEditor()">Save</button>');
  fields.filter(f=>f.type==='image').forEach(f=>{
    document.getElementById('ed-'+f.key).addEventListener('change',function(){
      const file=this.files[0]; if(!file) return;
      const rd=new FileReader(); rd.onload=()=>{_edImgs[f.key]=rd.result;document.getElementById('edp-'+f.key).innerHTML='<img src="'+rd.result+'">';}; rd.readAsDataURL(file);
    });
  });
}
function submitEditor(){
  const vals={};
  _ed.fields.forEach(f=>{ vals[f.key]= f.type==='image' ? (_edImgs[f.key]||'') : document.getElementById('ed-'+f.key).value.trim(); });
  const req=_ed.fields[0];
  if(req && req.type!=='image' && !vals[req.key]){ document.getElementById('ed-err').textContent='Please fill in '+req.label+'.'; return; }
  _ed.onSave(vals); closeModal(); render();
}

function noteHtml(){return BACKEND?'':'<div class="modal-note">Preview mode: not a real account yet. Add your Supabase keys to go live. You can change these later.</div>';}
/* ---- account rules: usernames (max 10 chars, letters/numbers/underscore) and passwords (min 5, one number + one symbol) ---- */
function userValid(u){ return /^[A-Za-z0-9_]{1,15}$/.test(u); }
function pwValid(p){ return p.length>=5 && /[0-9]/.test(p) && /[^A-Za-z0-9]/.test(p); }
function pwScore(p){ let s=0; if(p.length>=5)s++; if(p.length>=8)s++; if(/[0-9]/.test(p))s++; if(/[^A-Za-z0-9]/.test(p))s++; return s; }   // 0..4
function pwMeterHtml(id){ return '<div class="pw-meter" id="'+id+'-meter"><div class="pw-track"><div class="pw-fill"></div></div><div class="pw-row"><span class="pw-txt">Password strength</span><span class="pw-label"></span></div></div>'; }
function pwMeterBind(inputId,prefix){   // live meter: works as you type
  const inp=document.getElementById(inputId); if(!inp)return;
  const meter=document.getElementById(prefix+'-meter'); if(!meter)return;
  const fill=meter.querySelector('.pw-fill'), label=meter.querySelector('.pw-label');
  const upd=function(){
    const p=inp.value, sc=pwScore(p);
    fill.className='pw-fill'+(p?(sc<=1?' w1':(sc===2?' w2':(sc===3?' w3':' w4'))):'');
    label.className='pw-label '+(sc<=1?'weak':(sc===2?'medium':'strong'));
    label.textContent=p?(sc<=1?'Weak':(sc===2?'Medium':(sc===3?'Good':'Strong'))):'';
  };
  inp.addEventListener('input',upd); upd();
}
function fldHint(id,text){ return '<p class="fld-hint" id="'+id+'">'+text+'</p>'; }
function fldHintState(id,ok,okText,badText){ const el=document.getElementById(id); if(el){ el.className='fld-hint '+(ok?'ok':'bad'); el.textContent=ok?okText:badText; } }

    fldHint('su-user-hint','Up to 10 characters — letters, numbers and underscores only.')+
    '<label>Password</label><input id="su-pass" type="password" placeholder="Create a password" autocomplete="new-password">'+
    pwMeterHtml('su-pass')+
    fldHint('su-pass-hint','At least 5 characters, with at least one number and one symbol.')+
    '<label>Country <span style="font-weight:400;color:var(--muted)">(optional — you can add it later)</span></label><select id="su-country"><option value="">Select a country</option>'+CA_COUNTRIES.map(function(c){return '<option>'+esc(c)+'</option>';}).join('')+'</select>'+
    '<label>Chapter <span style="font-weight:400;color:var(--muted)">(optional \u2014 start typing to search)</span></label><input id="su-chapter" list="chapterList" type="text" placeholder="e.g. North Forest">'+chapterDatalist()+
    '<p class="err" id="su-err"></p><button class="btn btn-primary" id="su-btn" style="width:100%;margin-top:10px" onclick="doSignup()">Create account</button>');
  pwMeterBind('su-pass','su-pass');
  document.getElementById('su-user').addEventListener('input',function(){ fldHintState('su-user-hint',userValid(this.value),'Looks good.','Up to 10 characters — letters, numbers and underscores only.'); });
  document.getElementById('su-pass').addEventListener('input',function(){ fldHintState('su-pass-hint',pwValid(this.value),'Strong enough — you can use it.','At least 5 characters, with at least one number and one symbol.'); });
}
async function doSignup(){
  const email=v('su-email'),user=v('su-user'),pass=document.getElementById('su-pass').value,err=document.getElementById('su-err');
  const country=(document.getElementById('su-country')||{}).value||'';
  const chapTyped=((document.getElementById('su-chapter')||{}).value||'').trim();
  const chapId=chapterIdByName(chapTyped);
  if(chapTyped && chapId===null){ err.textContent='We couldn\u2019t find that chapter \u2014 pick one from the list, or leave it blank.'; return; }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){err.textContent='Please enter a valid email.';return;}
  if(!userValid(user)){err.textContent='Usernames are up to 15 characters — letters, numbers and underscores only.';return;}
  if(!pwValid(pass)){err.textContent='Passwords need at least 5 characters, including a number and a symbol.';return;}
  if(BACKEND){
    const b=document.getElementById('su-btn');b.disabled=true;b.textContent='Creating…';err.textContent='';
    try{ const av=await sb.rpc('username_available',{name:user}); if(!av.error && av.data===false){ b.disabled=false;b.textContent='Create account'; err.textContent='That username is already taken \u2014 please pick another.'; return; } }catch(e){}
    try{ const et=await sb.rpc('email_taken',{p_email:email}); if(!et.error && et.data===true){ b.disabled=false;b.textContent='Create account'; err.innerHTML='This email is already used \u2014 <a href="#" onclick="closeModal();openLogin(\''+escA(email)+'\');return false;">log in instead?</a>'; return; } }catch(e){}
    const {data,error}=await sb.auth.signUp({email,password:pass,options:{data:{username:user,country:country,chapter:chapId||''}}});
    if(error){b.disabled=false;b.textContent='Create account'; err.innerHTML=/already registered|already exists|already been registered|user_already/i.test(error.message)?'An account with that email already exists. <a href="#" onclick="closeModal();openLogin();return false;">Log in instead?</a>':(/duplicate|unique|username/i.test(error.message)?'That username is already taken \u2014 please pick another.':esc(error.message)); return;}
    if(!data.session){closeModal();popup('Almost there!','Check your email to confirm your account, then log in.');return;}
    await loadSession();closeModal();render();leafConfetti(20);toast('Welcome, '+user+'!');

function fpMsg(code,left){

  if(code==='too_many') return 'Too many wrong tries. Please resend a new code.';
  if(code==='no_code') return 'That code has expired or was already used. Please resend a new code.';
  if(code==='weak') return 'Password should be at least 6 characters.';
  return 'Something went wrong. Please try again.';

/* ---- profile picture: zoom + drag inside the circle, then export a square crop ---- */
const AV_SIZE=220, AV_OUT=256;
let _av=null;
function loadAvatarFile(file){ const rd=new FileReader(); rd.onload=function(){ loadAvatarSrc(rd.result); }; rd.readAsDataURL(file); }
function loadAvatarSrc(src){
  const img=new Image();
  img.onload=function(){
    const base=Math.max(AV_SIZE/img.width, AV_SIZE/img.height);            // "cover" the circle
    _av={img:img, base:base, scale:1, x:(AV_SIZE-img.width*base)/2, y:(AV_SIZE-img.height*base)/2, drag:null};
    const w=document.getElementById('pf-avwrap'); if(w)w.style.display='';
    const z=document.getElementById('pf-zoom'); if(z)z.value=1;
    drawAvatar();
  };
  img.src=src;
}
function clampAvatar(){ if(!_av)return; const s=_av.base*_av.scale, w=_av.img.width*s, h=_av.img.height*s;
  _av.x=Math.min(0,Math.max(AV_SIZE-w,_av.x)); _av.y=Math.min(0,Math.max(AV_SIZE-h,_av.y)); }
function drawAvatar(){
  const c=document.getElementById('pf-canvas'); if(!c||!_av)return;
  const g=c.getContext('2d'); g.clearRect(0,0,AV_SIZE,AV_SIZE);
  const s=_av.base*_av.scale;
  g.drawImage(_av.img,_av.x,_av.y,_av.img.width*s,_av.img.height*s);
}
function avZoom(val){
  if(!_av)return; const mid=AV_SIZE/2, old=_av.base*_av.scale;
  _av.scale=parseFloat(val)||1; const now=_av.base*_av.scale;
  _av.x=mid-(mid-_av.x)*(now/old); _av.y=mid-(mid-_av.y)*(now/old);   // zoom about the centre
  clampAvatar(); drawAvatar();
}
function avPt(e){ const r=document.getElementById('pf-canvas').getBoundingClientRect(); const t=(e.touches&&e.touches[0])||e; return {x:t.clientX-r.left, y:t.clientY-r.top}; }
function avDragStart(e){ if(!_av)return; e.preventDefault(); const p=avPt(e); _av.drag={x:p.x-_av.x,y:p.y-_av.y};
  window.addEventListener('mousemove',avDragMove); window.addEventListener('mouseup',avDragEnd);
  window.addEventListener('touchmove',avDragMove,{passive:false}); window.addEventListener('touchend',avDragEnd); }
function avDragMove(e){ if(!_av||!_av.drag)return; e.preventDefault(); const p=avPt(e); _av.x=p.x-_av.drag.x; _av.y=p.y-_av.drag.y; clampAvatar(); drawAvatar(); }
function avDragEnd(){ if(_av)_av.drag=null; window.removeEventListener('mousemove',avDragMove); window.removeEventListener('mouseup',avDragEnd); window.removeEventListener('touchmove',avDragMove); window.removeEventListener('touchend',avDragEnd); }
function avExport(){
  if(!_av)return null;
  const o=document.createElement('canvas'); o.width=AV_OUT; o.height=AV_OUT;
  const g=o.getContext('2d'), k=AV_OUT/AV_SIZE, s=_av.base*_av.scale;
  g.drawImage(_av.img,_av.x*k,_av.y*k,_av.img.width*s*k,_av.img.height*s*k);
  try{ return o.toDataURL('image/jpeg',0.9); }catch(e){ return null; }
}

// preview roles are built LIVE from the roles map, so custom roles you create (e.g. "Poster") become preview options too
const PREVIEW_ORDER=['public','member','chapter_leader','moderator','admin','owner','developer'];
function canManagePreview(){
  if(!BACKEND) return true;
  if(!account) return false;
  if(account.roleId==='owner'||account.roleId==='developer') return true;
  return !!(roles[account.roleId]&&roles[account.roleId].caps&&roles[account.roleId].caps.edit_content);
}
function previews(){
  const out=[{id:'public',label:'Public'}]; // Public = view as a logged-out visitor
  if(!BACKEND || (account&&(account.roleId==='owner'||account.roleId==='developer'))){
    Object.keys(roles).filter(function(id){return id!=='public';})
      .sort(function(a,b){ const ia=PREVIEW_ORDER.indexOf(a), ib=PREVIEW_ORDER.indexOf(b); return (ia<0?99:ia)-(ib<0?99:ib); })
      .forEach(function(id){ out.push({id:id,label:(roles[id]&&roles[id].name)||id}); });
    // Only a real Developer can preview as Developer; Owners cannot.
    if(!(account && account.roleId==='developer')) return out.filter(function(p){ return p.id!=='developer'; });
    return out;
  }
  // Content editors can preview the public and member-facing views, but cannot impersonate privileged roles.
  if(roles.member) out.push({id:'member',label:(roles.member.name||'Member')});
  if(account && account.roleId!=='public' && account.roleId!=='member') out.push({id:account.roleId,label:(roles[account.roleId]&&roles[account.roleId].name)||account.roleId});
  return out;
}
function setPreview(id){
  if(!previews().some(function(p){return p.id===id;})){ toast('That preview role is not available to this account.'); return; }
  previewAs=id; recomputeSession(); if(!canView(route()))go('home'); render();
}
const curPreview=()=> previewAs || (account?account.roleId:'public');
// the preview bar is a leadership tool: the real Owner and Developer see it (but Owners can never preview as Developer); the x hides it, the eye in the top bar brings it back
let previewBarHidden=false;
function hidePreviewBar(){ previewBarHidden=true; const pb=document.getElementById('protoBar'); if(pb) pb.style.display='none'; }

const showPreviewBar=()=> (!previewBarHidden) && canManagePreview();
function toggleTheme(){ theme=theme==='dark'?'light':'dark'; document.body.setAttribute('data-theme',theme);
  try{ localStorage.setItem('ese_theme',theme); }catch(e){}
  _lastAppHtml=null;   // the home page HTML is identical in both themes, so force a rebuild — otherwise the hero (and its moon) never re-initializes on the theme flip
  render(); }

function renderChrome(){
  const abar=document.getElementById('annBar'); if(abar) abar.innerHTML=annBarHtml();   // site-wide announcement banner (dismissable per announcement)
  const proto=document.getElementById('protoBar');
  if(showPreviewBar()){
    proto.style.display='';
    document.getElementById('previewBar').innerHTML=previews().map(p=>'<button class="'+(curPreview()===p.id?'active':'')+'" onclick="setPreview(\''+p.id+'\')">'+esc(p.label)+'</button>').join('');
    document.getElementById('backendTag').textContent = BACKEND ? 'Accounts: live' : '';
  } else {
    proto.style.display='none';
  }
  const r=route();
  const visRoutes=ROUTES.filter(rt=>!NAV_HIDDEN.includes(rt)&&canView(rt));
  const admCls=rt=>((rt==='admin'||rt==='analytics')?'admin ':'');
  const navDot=rt=>(rt==='analytics'&&notifCount>0?' <span class="tabdot"></span>':'');
  const sideList=document.getElementById('sidebarList');   // the floating drawer: pages only; the account lives in the top bar now
  if(sideList){
    const item=rt=>'<button class="side-item '+admCls(rt)+(r===rt?'active':'')+'" data-tip="'+esc(TAB[rt])+'" onclick="sideNav(\''+rt+'\')">'+
      '<span class="s-ic">'+navIcon(rt)+'</span><span class="s-lab">'+TAB[rt]+navDot(rt)+'</span><span class="s-arrow">'+ICONS.chev+'</span></button>';

      '<div class="sidebar-head">'+
        '<div><div class="sh-name" data-notranslate>Earth <span class="sw">Sweet</span> Earth</div>'+
        '<div class="sh-sub">'+(account?('Signed in as '+esc(account.username)):'Explore the site')+'</div></div>'+
        '<button class="sh-x" aria-label="Close menu" onclick="closeSidebar()">\u00d7</button>'+
      '</div>'+
      '<div class="sidebar-sep"></div>'+

  const searchBtn='<button class="iconbtn" data-tip="Search (Ctrl+K)" aria-label="Search pages" onclick="openPalette()">'+ICONS.search+'</button>';
  const bell=(isOwner()&&notifCount>0)?'<button class="iconbtn bellbtn" data-tip="'+notifCount+' application'+(notifCount===1?' needs':'s need')+' review" aria-label="Notifications" onclick="go(\'analytics\')">'+

async function deleteFooterItem(kind,index){
  if(!canEdit('edit_content')){ toast('You do not have permission to edit this item.'); return; }
  const key=COLL[kind], arr=content[key]||[];
  if(!['social','affiliation'].includes(kind)||!Number.isInteger(index)||index<0||index>=arr.length) return;
  const removed=arr.splice(index,1)[0];
  render();
  const saved=await saveSiteContent(true);
  if(saved===false){ arr.splice(index,0,removed); render(); return; }
  toast('Removed '+(kind==='social'?'social account':'affiliation'));
}

function renderFooter(){
  const ed=canEdit('edit_content');
  const socials=content.socials||[], affs=content.affiliations||[];
  const removeBtn=(kind,x,i)=>ed?'<button class="footer-remove" type="button" title="Remove '+(kind==='social'?'social account':'affiliation')+'" aria-label="Remove '+(kind==='social'?'social account':'affiliation')+'" onclick="deleteFooterItem(\''+kind+'\','+i+')">Remove</button>':'';
  let s='';
  if(socials.length||ed){ s='<div class="fcol"><div class="flab">Follow us</div>'+ (socials.length?'<div class="links">'+socials.map((x,i)=>'<span class="footer-managed-link"><a href="'+escA(safeUrl(x.url))+'" target="_blank" rel="noopener">'+esc(x.label)+'</a>'+removeBtn('social',x,i)+'</span>').join('')+'</div>':'') + (ed?'<div style="margin-top:10px"><button class="addbtn" onclick="addItem(\'social\')">+ Add social account</button></div>':'')+'</div>'; }
  let a='';
  if(affs.length||ed){ a='<div class="fcol"><div class="flab">Affiliations</div>'+ (affs.length?'<div class="links">'+affs.map((x,i)=>'<span class="footer-managed-link">'+(x.url?'<a href="'+escA(safeUrl(x.url))+'" target="_blank" rel="noopener">'+esc(x.label)+'</a>':'<span class="lk">'+esc(x.label)+'</span>')+removeBtn('affiliation',x,i)+'</span>').join('')+'</div>':'') + (ed?'<div style="margin-top:10px"><button class="addbtn" onclick="addItem(\'affiliation\')">+ Add affiliation</button></div>':'')+'</div>'; }
  document.getElementById('footer').innerHTML='<div class="wrap"><div class="fm" data-notranslate>Earth <span class="sw">Sweet</span> Earth</div>'+s+a+'<div class="flegal"><a href="#/changelog">Changelog</a> · <a href="#/privacy">Privacy Policy</a> · <a href="#/terms">Terms &amp; Conditions</a></div><div class="cpy" data-notranslate>© 2026 Earth Sweet Earth</div></div>';
}

let aboutStats=null, aboutStatsLoading=false;
function ensureAboutStats(){ if(aboutStats!==null||aboutStatsLoading)return; aboutStatsLoading=true; loadAboutStats(); }
async function loadAboutStats(){
  if(!BACKEND){ aboutStats={people:people.length,countries:1}; aboutStatsLoading=false; if(route()==='about')render(); return; }
  try{ const {data,error}=await sb.rpc('ese_stats'); if(error||!data){ aboutStats='error'; } else { aboutStats={people:data.people||0,countries:data.countries||0}; } }
  catch(e){ aboutStats='error'; }
  aboutStatsLoading=false; if(route()==='about')render();
}
const ABOUT_SLOTS={
  board:['Director','Director','Treasurer'],
  advisory:['Advisory Council','Advisory Council','Advisory Council'],
  youth:['President','Vice President','Treasurer','Secretary']
};
// The starter circles are real, editable entries: an owner can fill one in, or delete it outright.
function seedAbout(){
  if(content.aboutSeeded) return;
  Object.keys(ABOUT_SLOTS).forEach(function(k){
    if(!content[k] || !content[k].length){
      content[k]=ABOUT_SLOTS[k].map(function(r,i){ return {id:uid()+i, name:'', role:r, placeholder:true}; });
    }
  });
}
function fillSlot(kind,id){
  const it=(content[kind]||[]).find(function(x){return sameId(x.id,id);}); if(!it)return;
  openEditor('Add '+esc(it.role||'someone'), FIELDS[kind], {role:it.role}, function(v){
    Object.assign(it,v); it.placeholder=false; content.aboutSeeded=true; toast('Added'); saveSiteContent(true);
  });
}
function profileCard(p,kind,ed){
  if(p.placeholder){
    return '<div class="pcard"><div class="pc-pic pc-empty"></div><div class="pc-body">'+
      '<div class="pc-role" style="margin-top:0">'+esc(p.role||'Open role')+'</div>'+
      (ed?'<div class="rowbtns" style="justify-content:center;margin-top:9px"><button class="btn btn-ghost btn-xs" onclick="fillSlot(\''+kind+'\',\''+p.id+'\')">+ Add</button><button class="btn btn-ghost btn-xs" title="Remove this slot" onclick="deleteItem(\''+kind+'\',\''+p.id+'\')">\u00d7</button></div>':'')+
    '</div></div>';
  }
  const ph=p.photo?'<img class="pc-pic" src="'+escA(p.photo)+'">':'<div class="pc-pic pc-noimg">'+esc((p.name||'?').charAt(0).toUpperCase())+'</div>';
  return '<div class="pcard">'+ph+'<div class="pc-body">'+
    '<div class="pc-name">'+esc(p.name||'Name')+'</div>'+
    (p.role?'<div class="pc-role">'+esc(p.role)+'</div>':'')+
    (p.bio?'<p class="pc-bio">'+esc(p.bio)+'</p>':'')+

  '</div></div>';
}

function joinDiscord(){
  if(!isLoggedIn()){ popup('Almost there!','You have to make an account before you can join the Discord!'); return; }
  const url=content.discord||DISCORD_URL;
  if(url){ markDiscordJoined(); window.open(safeUrl(url),'_blank','noopener'); } else { comingSoon(); }
}
/* ---------- "Join our Discord" nudge ----------
   We can't see whether someone actually joined the server (only Discord knows that), but we CAN
   tell whether they've ever used our "Join our Discord" link. We remember that in the browser.
   Until they do, we gently remind them once each time they open the site. Someone who has linked
   their Discord account (the verify flow) also counts as "in" and is never nudged. */
function discordJoinedLocally(){ try{ return localStorage.getItem('ese_discord_joined')==='1'; }catch(e){ return false; } }
function markDiscordJoined(){ try{ localStorage.setItem('ese_discord_joined','1'); }catch(e){} }
function discordAlreadyIn(){ return discordJoinedLocally() || !!(account && account.discord); }
function maybeDiscordNudge(){
  if(discordAlreadyIn()) return;                                   // already used the link (or linked Discord) — don't nag
  const url=content.discord||DISCORD_URL;
  if(!url) return;                                                 // no invite set yet — nothing to join
  try{ if(modal && modal.classList.contains('open')) return; }catch(e){}   // don't stack on another popup
  if(document.getElementById('tourOv')) return;                   // let the first-visit tour finish
  const intro=document.getElementById('langIntro');
  if(intro && !intro.classList.contains('li-hidden')) return;     // let the language intro finish first
  openDiscordNudge();
}
function openDiscordNudge(){
  const needsAccount=!isLoggedIn();
  openModal('<button class="x" onclick="closeModal()" aria-label="Close">×</button>'+

function snowLayer(){
  let s='';
  for(let i=0;i<38;i++){
    const x=(fr(i*1.3)*100).toFixed(1), sz=(fr(i*2.7)*3+2).toFixed(1), dur=(fr(i*3.1)*5+6).toFixed(1),
          del=(fr(i*4.9)*-11).toFixed(1), dx=((fr(i*5.3)-0.5)*80).toFixed(0), op=(fr(i*6.1)*0.5+0.5).toFixed(2);
    s+='<span style="left:'+x+'%;width:'+sz+'px;height:'+sz+'px;--dx:'+dx+'px;opacity:'+op+';animation-duration:'+dur+'s;animation-delay:'+del+'s"></span>';
  }
  return '<div class="snow" id="snow">'+s+'</div>';
}

// correct lunar terminator: new → crescent → quarter → gibbous → full → … (gibbous reads as gibbous, not a fat crescent)
function moonLitPath(f){
  const R=54,cx=92,cy=92;
  const rx=Math.abs(R*Math.cos(f*2*Math.PI)).toFixed(2);
  const T=cx+','+(cy-R), B=cx+','+(cy+R);
  const limb=f<0.5?1:0;
  const term=(f<0.25||f>0.75)?limb:1-limb;
  return 'M'+T+' A'+R+','+R+' 0 0,'+limb+' '+B+' A'+rx+','+R+' 0 0,'+term+' '+T+' Z';
}

/* ---- past issues open as PDFs: use a hosted link if set, else build one from the text ---- */
function openIssuePdf(id){
  const n=newsletters.find(function(x){return sameId(x.id,id);}); if(!n)return;
  if(n.pdfUrl){ window.open(/^https?:/i.test(n.pdfUrl)?n.pdfUrl:n.pdfUrl,'_blank','noopener'); return; }
  try{
    const blob=new Blob([buildPdf(n.title, fmtDateTime(n.publishedAt), n.body||'')],{type:'application/pdf'});
    const url=URL.createObjectURL(blob);
    window.open(url,'_blank','noopener');
    setTimeout(function(){ URL.revokeObjectURL(url); }, 60000);
  }catch(e){ toast('Couldn\u2019t build the PDF.'); }
}
function pdfAscii(s){ return String(s==null?'':s).replace(/[\u2018\u2019]/g,"'").replace(/[\u201C\u201D]/g,'"').replace(/[\u2013\u2014]/g,'-').replace(/\u2026/g,'...').replace(/[^\x20-\x7E\n]/g,''); }
function pdfEsc(s){ return s.replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)'); }
function pdfWrap(s,max){
  const out=[];
  pdfAscii(s).split('\n').forEach(function(para){
    if(!para.trim()){ out.push(''); return; }
    let line='';
    para.split(/\s+/).forEach(function(w){
      if((line?line+' '+w:w).length>max){ if(line)out.push(line); line=w; } else { line=line?line+' '+w:w; }
    });
    if(line) out.push(line);
  });
  return out;
}
// A minimal, dependency-free PDF writer (Helvetica, letter pages).
function buildPdf(title,dateStr,body){
  const PER=44, MAXW=92;
  const lines=[pdfAscii(dateStr),''].concat(pdfWrap(body,MAXW));
  const pages=[];
  for(let i=0;i<lines.length;i+=PER) pages.push(lines.slice(i,i+PER));
  if(!pages.length) pages.push(['']);
  const N=pages.length, objs=[], kids=[];
  for(let i=0;i<N;i++) kids.push((5+i*2)+' 0 R');
  objs[1]='<< /Type /Catalog /Pages 2 0 R >>';
  objs[2]='<< /Type /Pages /Kids ['+kids.join(' ')+'] /Count '+N+' >>';
  objs[3]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
  pages.forEach(function(ls,pi){
    let c='';
    if(pi===0) c+='BT /F1 16 Tf 72 742 Td ('+pdfEsc(pdfAscii(title))+') Tj ET\n';
    c+='BT /F1 11 Tf 72 '+(pi===0?712:742)+' Td 15 TL\n';
    ls.forEach(function(l){ c+='('+pdfEsc(l)+') Tj T*\n'; });
    c+='ET';
    objs[4+pi*2]='<< /Length '+c.length+' >>\nstream\n'+c+'\nendstream';
    objs[5+pi*2]='<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << /Font << /F1 3 0 R >> >> /Contents '+(4+pi*2)+' 0 R >>';
  });
  const maxId=3+N*2, off=[];
  let out='%PDF-1.4\n';
  for(let id=1; id<=maxId; id++){ off[id]=out.length; out+=id+' 0 obj\n'+objs[id]+'\nendobj\n'; }
  const xref=out.length;
  out+='xref\n0 '+(maxId+1)+'\n0000000000 65535 f \n';
  for(let id=1; id<=maxId; id++){ out+=('0000000000'+off[id]).slice(-10)+' 00000 n \n'; }
  out+='trailer\n<< /Size '+(maxId+1)+' /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF';
  return out;
}
function fmtDateTime(ts){ if(!ts)return ''; const d=new Date(ts); return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})+' \u00b7 '+d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}); }

let eventCounts={}, myEvents={}, eventDataLoaded=false;
function eventTime(e){ if(!e.date) return 0; return new Date(e.date+'T'+(e.time||'00:00')).getTime(); }
function isUpcoming(e){ return eventTime(e) >= Date.now()-3600000; }
function ensureEventData(){ if(eventDataLoaded) return; eventDataLoaded=true; loadEventData(); }
async function loadEventData(){
  if(!BACKEND) return;
  try{ const {data}=await sb.rpc('ese_event_counts'); if(data) eventCounts=data; }catch(e){}
  if(account && account.id){
    try{ const {data}=await sb.from('event_participants').select('event_id').eq('user_id',account.id);
      myEvents={}; (data||[]).forEach(function(r){ myEvents[r.event_id]=true; }); }catch(e){}
  }
  if(route()==='calendar') render();
}
async function joinEvent(id){
  if(!isLoggedIn()){ goParticipate(); return; }
  const eid=String(id), joined=!!myEvents[eid];
  if(joined){
    delete myEvents[eid]; eventCounts[eid]=Math.max(0,(eventCounts[eid]||1)-1); render();
    if(BACKEND && account.id){ try{ await sb.from('event_participants').delete().eq('event_id',eid).eq('user_id',account.id); }catch(e){} }
    toast('You\u2019re no longer signed up.');
  } else {
    myEvents[eid]=true; eventCounts[eid]=(eventCounts[eid]||0)+1; render();
    if(BACKEND && account.id){
      try{ const {error}=await sb.from('event_participants').insert({event_id:eid,user_id:account.id,username:account.username,email:account.email});
        if(error) throw error; }
      catch(e){ delete myEvents[eid]; eventCounts[eid]=Math.max(0,(eventCounts[eid]||1)-1); render(); toast('Couldn\u2019t sign you up \u2014 is the event_participants table set up?'); return; }
    }
    toast('You\u2019re in!');
  }
}

const PCAP={};

function pcapShape(ctx,x,y,s){

  ctx.lineTo(x+s,y);
  ctx.lineTo(x+s,y+s);
  ctx.lineTo(x,y+s);
  ctx.closePath();
}
function pcapScene(ctx,W,H,d){

  ctx.fillStyle='rgba(255,255,255,.82)';

  const hills=['#7cbb80','#3f8f5c','#1f6b3f'];
  hills.forEach(function(col,i){ ctx.fillStyle=col; const b=H*(0.62+i*0.13);
    ctx.beginPath(); ctx.moveTo(0,H); ctx.lineTo(0,b); ctx.quadraticCurveTo(W*d.hx[i], b-d.hh[i], W, b-6); ctx.lineTo(W,H); ctx.closePath(); ctx.fill(); });
}

function initPuzzleCaptcha(id){
  const host=document.getElementById(id); if(!host) return;
  host.classList.add('pcap'); host.classList.remove('solved');
  host.innerHTML='<div class="pcap-stage"><canvas class="pcap-canvas"></canvas>'+
    '<button type="button" class="pcap-refresh" title="Get a new puzzle" aria-label="Get a new puzzle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px;display:block;margin:0 auto"><path d="M21 12a9 9 0 11-2.6-6.4"/><path d="M21 3v6h-6"/></svg></button>'+
    '<div class="pcap-done">✓ Verified</div></div>'+
    '<input type="range" class="pcap-slider" min="0" max="100" value="0" step="1" aria-label="Slide the puzzle piece into the gap to complete the picture and show you are human">'+
    '<p class="pcap-label">Slide the piece into the gap to finish the picture.</p>';
  const canvas=host.querySelector('.pcap-canvas'), slider=host.querySelector('.pcap-slider');
  const dpr=window.devicePixelRatio||1, W=Math.max(240,Math.min(420,host.clientWidth||300)), H=168, s=46;
  canvas.width=W*dpr; canvas.height=H*dpr; canvas.style.width=W+'px'; canvas.style.height=H+'px';
  const ctx=canvas.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
  const st={id:id,ctx:ctx,W:W,H:H,s:s,solved:false}; PCAP[id]=st; pcapNew(st);
  function move(){ if(st.solved)return; st.px=(slider.value/100)*(W-s); pcapRender(st);
    if(Math.abs(st.px-st.tx)<=10){ st.solved=true; st.px=st.tx; slider.value=Math.round(st.tx/(W-s)*100); pcapRender(st); host.classList.add('solved'); slider.disabled=true; } }
  slider.addEventListener('input',move);
  host.querySelector('.pcap-refresh').addEventListener('click',function(){ st.solved=false; slider.disabled=false; slider.value=0; host.classList.remove('solved'); pcapNew(st); });
}
function puzzleSolved(id){ return !!(PCAP[id]&&PCAP[id].solved); }
/* ---- form drafts: keep an in-progress application (all fields + drawn signatures) so leaving the page and coming back doesn't lose it. Stored per-device in localStorage; cleared on submit. ---- */
const DRAFT_TTL=30*24*3600*1000;   // forget an untouched draft after 30 days
function _draftKey(formId){ return 'ese_draft_'+formId; }
function saveFormDraft(formId){
  const f=document.getElementById(formId); if(!f)return;
  const d={ts:Date.now(),fields:{},sigs:{}};
  Array.prototype.forEach.call(f.querySelectorAll('input,textarea,select'),function(el){
    if(!el.id || el.type==='file' || el.classList.contains('pcap-slider')) return;   // skip file inputs + the human-check slider (re-verify each time)
    if(el.type==='checkbox'||el.type==='radio') d.fields[el.id]={c:el.checked}; else d.fields[el.id]={v:el.value};
  });
  Array.prototype.forEach.call(f.querySelectorAll('canvas.sigpad'),function(cv){ if(cv.id && cv._drawn){ try{ d.sigs[cv.id]=cv.toDataURL('image/png'); }catch(e){} } });
  try{ localStorage.setItem(_draftKey(formId),JSON.stringify(d)); }catch(e){}
}
function restoreFormDraft(formId){
  let d; try{ d=JSON.parse(localStorage.getItem(_draftKey(formId))||'null'); }catch(e){}
  if(!d || (d.ts && Date.now()-d.ts>DRAFT_TTL)){ if(d) clearFormDraft(formId); return false; }
  const f=document.getElementById(formId); if(!f)return false;
  Object.keys(d.fields||{}).forEach(function(id){ const el=document.getElementById(id); if(!el)return; const s=d.fields[id]; if('c' in s)el.checked=!!s.c; else if('v' in s)el.value=s.v; });
  Object.keys(d.sigs||{}).forEach(function(id){ const cv=document.getElementById(id); if(cv&&cv._ctx){ const img=new Image(); img.onload=function(){ try{ cv._ctx.save(); cv._ctx.setTransform(1,0,0,1,0,0); cv._ctx.drawImage(img,0,0,cv.width,cv.height); cv._ctx.restore(); cv._drawn=true; }catch(e){} }; img.src=d.sigs[id]; } });
  return true;
}
function clearFormDraft(formId){ try{ localStorage.removeItem(_draftKey(formId)); }catch(e){} }
let _draftForms={}, _draftGlobalBound=false, _draftT={};
function _draftSave(formId){ clearTimeout(_draftT[formId]); _draftT[formId]=setTimeout(function(){ saveFormDraft(formId); },350); }
function attachFormDraft(formId){
  const f=document.getElementById(formId); if(!f)return; _draftForms[formId]=1;
  if(!f._draftBound){ f._draftBound=true; f.addEventListener('input',function(){_draftSave(formId);}); f.addEventListener('change',function(){_draftSave(formId);}); }
  if(!_draftGlobalBound){ _draftGlobalBound=true;                                   // signatures end on a pointer-up anywhere; save after each stroke
    const g=function(){ Object.keys(_draftForms).forEach(function(fid){ if(document.getElementById(fid)) _draftSave(fid); }); };
    document.addEventListener('mouseup',g); document.addEventListener('touchend',g); }
}

async function submitChapterApplication(e){
  if(e&&e.preventDefault)e.preventDefault();
  const errBox=document.getElementById('ca-err');
  const fail=(msg,id)=>{ if(errBox){ errBox.textContent=msg; errBox.style.display='block'; errBox.scrollIntoView({behavior:'smooth',block:'center'}); } const f=id&&document.getElementById(id); if(f&&f.focus)f.focus(); return false; };
  const val=(id)=>{ const el=document.getElementById(id); return el?el.value.trim():''; };
  if(!val('ca-name')) return fail('Please enter your first name and last initial.','ca-name');
  if(!val('ca-grade')) return fail('Please choose your grade.','ca-grade');
  if(!val('ca-country')) return fail('Please choose your country or territory.','ca-country');
  const subShown=document.getElementById('ca-subwrap').style.display!=='none';
  if(subShown && !val('ca-sub')) return fail('Please choose your state / province.','ca-sub');
  if(!val('ca-school')) return fail('Please enter your full school name and district.','ca-school');
  const members=[]; for(let i=1;i<=4;i++){ const v=val('ca-p'+i); if(!v) return fail('Please fill in all four names — you and three friends.','ca-p'+i); members.push(v); }
  const memberDiscords=[];   // members' Discord usernames are no longer collected or required
  const norm=(s)=>s.toLowerCase().replace(/\s+/g,' ').replace(/[\u2018\u2019]/g,"'").trim();
  const consentTyped=norm(val('ca-consent')), consentTr=caConsentTranslation();   // accept either the English OR the translated statement
  if(consentTyped!==norm(CA_CONSENT) && !(consentTr && consentTr!==CA_CONSENT && consentTyped===norm(consentTr))) return fail('You have a mistake in the statement. Please type it out fully and correctly.','ca-consent');
  const why=val('ca-why'); if(!why) return fail('Please tell us why you want to start a chapter.','ca-why');
  if(caWords(why)>500) return fail('Please keep your answer to 500 words or fewer.','ca-why');
  if(!document.getElementById('ca-privacy').checked) return fail('Please check the privacy confirmation box.','ca-privacy');
  const par=document.getElementById('ca-sig-parent'), self=document.getElementById('ca-sig-self');
  if(!par||!par._drawn) return fail('A parent or guardian needs to sign in the box.','ca-sig-parent');
  if(!self||!self._drawn) return fail('Please add your own signature.','ca-sig-self');
  if(!puzzleSolved('ca-cap')) return fail('Please slide the puzzle piece into the gap to show you are human.');
  if(errBox) errBox.style.display='none';
  const app={ name:val('ca-name'), discord:val('ca-discord'), grade:val('ca-grade'), country:val('ca-country'), subdivision:subShown?val('ca-sub'):'', school:val('ca-school'), members, memberDiscords, why, parentSignature:par.toDataURL('image/png'), selfSignature:self.toDataURL('image/png'), submittedAt:new Date().toISOString() };
  const btn=document.querySelector('#caForm button[type="submit"]'); if(btn){ btn.disabled=true; btn.textContent='Submitting\u2026'; }
  let ok=true, emsg='';
  if(BACKEND){ try{ const {error}=await sb.from('chapter_applications').insert({data:app}); if(error){ ok=false; emsg=error.message; } else { try{ sb.functions.invoke('notify-application',{body:{type:'chapter',data:app}}); }catch(e){} } }catch(ex){ ok=false; emsg='network error'; } }
  if(ok){ leafConfetti(); clearFormDraft('caForm'); openModal('<h3>Application received! \ud83c\udf31</h3><p>Thanks, '+esc(app.name)+'! The ESE team will review it and reach out on Discord. You can close this window.</p><button class="btn btn-primary" style="width:100%;margin-top:8px" onclick="closeModal();go(\'chapters\')">Done</button>'); }
  else { if(btn){ btn.disabled=false; btn.textContent='Submit application'; } fail('Sorry \u2014 we couldn\u2019t submit that ('+emsg+'). Please try again in a moment.'); }
  return false;
}

/* ========================= CHAPTERS (own table) + CHAPTER HUB ========================= */
let chaptersRows=[], chapterEvents={}, chaptersLoaded=false, chaptersFetched=!BACKEND;   // chaptersFetched: data is really in (for skeletons + the map)
function ensureChapters(){ if(chaptersLoaded) return; chaptersLoaded=true; loadChapters(); }
async function loadChapters(){
  if(!BACKEND){ chaptersRows=content.chapters||[]; return; }
  try{
    const {data}=await sb.from('chapters').select('id,name,country,continent,leader_id,gcal_id').order('name');
    chaptersRows=(data||[]).map(function(r){ return {id:r.id,name:r.name,country:r.country||'',continent:r.continent||'',leaderId:r.leader_id,gcalId:r.gcal_id||''}; });
  }catch(e){ chaptersRows=[]; }
  const mine=myChapter(); if(mine) await loadChapterEvents(mine.id);
  const led=myLedChapter(); if(led && (!mine||!sameId(led.id,mine.id))) await loadChapterEvents(led.id);
  chaptersFetched=true;
  const r=route(); if(r==='chapterhub'||r==='calendar'||r==='chapterslist') render();
}
async function loadChapterEvents(cid){
  if(!BACKEND || !cid){ chapterEvents[cid]=chapterEvents[cid]||[]; return; }
  try{ const {data}=await sb.from('chapter_events').select('*').eq('chapter_id',cid).order('date');
    chapterEvents[cid]=(data||[]).map(function(e){ return {id:e.id,name:e.name,date:e.date||'',time:e.time||'',link:e.link||'',color:e.color||'Green',details:e.details||''}; });
  }catch(e){ chapterEvents[cid]=[]; }
}
function myLedChapter(){ if(!account||!account.id) return null; return chaptersRows.find(function(c){return sameId(c.leaderId,account.id);})||null; }
function myChapter(){ if(!account||!account.chapter) return null; return chaptersRows.find(function(c){return sameId(c.id,account.chapter);})||null; }
function chapterName(id){ const c=chaptersRows.find(function(x){return sameId(x.id,id);}); return c?c.name:''; }
function chapterDatalist(){ return '<datalist id="chapterList">'+chaptersRows.map(function(c){return '<option value="'+escA(c.name)+'">';}).join('')+'</datalist>'; }
function chapterIdByName(nm){ nm=(nm||'').trim().toLowerCase(); if(!nm) return ''; const c=chaptersRows.find(function(x){return (x.name||'').trim().toLowerCase()===nm;}); return c?c.id:null; }

/* ---- owner/admin chapter admin (writes the chapters table) ---- */
async function addChapterRow(){
  openEditor('Add a chapter', FIELDS.chapter, null, async function(v){
    if(!BACKEND){ chaptersRows.push({id:uid(),name:v.name,country:v.country,continent:v.continent,leaderId:null,gcalId:''}); render(); return; }
    const {error}=await sb.from('chapters').insert({name:v.name,country:v.country,continent:v.continent});
    if(error) toast('Couldn\u2019t add: '+error.message); else { await loadChapters(); toast('Added'); render(); }
  });
}
async function deleteChapterRow(id){
  if(!BACKEND){ chaptersRows=chaptersRows.filter(function(c){return !sameId(c.id,id);}); render(); return; }
  const {error}=await sb.from('chapters').delete().eq('id',id);
  if(error) toast('Couldn\u2019t remove: '+error.message); else { await loadChapters(); toast('Removed'); render(); }
}

function createMyChapter(){
  if(!isLoggedIn()){ popup('Log in first','You need to be logged in to create a chapter.'); return; }
  openEditor('Create my chapter', FIELDS.chapter, null, async function(v){
    if(!BACKEND){ const id=uid(); chaptersRows.push({id:id,name:v.name,country:v.country,continent:v.continent,leaderId:account.id||'me',gcalId:''}); account.chapter=id; render(); return; }
    const {data,error}=await sb.from('chapters').insert({name:v.name,country:v.country,continent:v.continent,leader_id:account.id}).select().single();
    if(error){ toast('Couldn\u2019t create: '+error.message); return; }
    await sb.from('profiles').update({chapter:data.id}).eq('id',account.id);
    account.chapter=data.id; await loadChapters(); toast('Chapter created!'); render();
  });
}
function editMyChapter(){

function resolveCountry(c){
  c=(c||'').replace(/^the\s+/i,'').trim().toLowerCase(); if(!c) return null;
  if(_LL_NORM[c]) return _LL_NORM[c];

  if(c.length>=4){ const hit=Object.keys(_LL_NORM).find(function(k){ return k.length>=4&&(k.indexOf(c)===0||c.indexOf(k)===0); }); if(hit) return _LL_NORM[hit]; }
  return null;

function worldMapHtml(){

  WORLD_LAND.forEach(function(rg){ for(let c=rg[1];c<=rg[2];c++){ if(fr(c*7.3+rg[0]*3.1)<0.82) dots+='<circle class="land" cx="'+(c+0.5)+'" cy="'+(rg[0]+0.5)+'" r="0.42"/>'; } });
  _mapPins=Object.keys(groups).filter(function(c){ return COUNTRY_LL[c]; }).sort();
  const HQ=COUNTRY_LL['United States']||[39,-98];

  const arcs=_mapPins.map(function(c){ const ll=COUNTRY_LL[c]; if(c==='United States') return '';   // HQ's own pin needs no arc
    const x=((ll[1]+180)/360*72), y=((90-ll[0])/180*32);
    const mx=(hx+x)/2, dist=Math.abs(x-hx)+Math.abs(y-hy), my=Math.min(hy,y)-Math.min(6,dist*0.22);
    return '<path class="arc" d="M'+hx.toFixed(2)+','+hy.toFixed(2)+' Q'+mx.toFixed(2)+','+my.toFixed(2)+' '+x.toFixed(2)+','+y.toFixed(2)+'"/>';
  }).join('');

    '<div class="wmap-legend"><span><span class="dotk"></span>Country with a chapter</span><span style="margin-left:auto">Every dot is land; pins mark our chapters.</span></div></div>';
}

    body+
  '</div>';

/* 2.8: members can join (or leave) a chapter right from Our Chapters \u2014 no longer only at sign-up */
async function joinChapter(id){
  if(!isLoggedIn()){ popup('Join us','Sign up or log in to join a chapter!'); return; }
  const ch=chaptersRows.find(c=>String(c.id)===String(id)); const nm=ch?ch.name:'that chapter';
  const inIt=account.chapter&&String(account.chapter)===String(id);
  const switching=account.chapter&&!inIt;
  const target=inIt?null:id;
  if(!BACKEND){ account.chapter=target; recomputeSession(); render(); toast(target?('Joined '+nm+' (preview)'):('You left '+nm+' (preview)')); return; }
  try{
    const {data:{user:u}}=await sb.auth.getUser(); if(!u){ toast('Please log in again','err'); return; }
    const {error}=await sb.from('profiles').update({chapter:target}).eq('id',u.id);
    if(error){ toast('Couldn\\u2019t save: '+error.message,'err'); return; }
    account.chapter=target; recomputeSession(); render();
    toast(target?((switching?'Switched to ':'Joined ')+nm):('You left '+nm));
  }catch(e){ toast('Couldn\\u2019t save \\u2014 please try again','err'); }
}

// load all saved reactions + comments from Supabase into gSocial (so they persist + are shared, not just in-memory)
async function loadSocial(){
  if(!BACKEND) return;
  try{
    const res=await Promise.all([
      sb.from('post_comments').select('id,post_id,user_id,username,avatar,name_color,body,parent_id,created_at,edited_at').order('created_at',{ascending:true}),
      sb.from('post_reactions').select('target_id,user_id,emoji')
    ]);
    const cmts=(res[0]&&res[0].data)||[], rx=(res[1]&&res[1].data)||[];
    const uids=[...new Set(cmts.map(function(c){return c.user_id;}).filter(Boolean))];
    let currentAvatars={};
    if(uids.length){
      try{ const pr=await sb.from('profiles').select('id,avatar,username').in('id',uids);
        (pr.data||[]).forEach(function(p){currentAvatars[String(p.id)]=p;});
      }catch(e){}
    }
    gSocial={};                       // rebuild from the source of truth
    const cIndex={};
    cmts.forEach(function(c){ const prof=currentAvatars[String(c.user_id)]||{};
      const liveAvatar=(account&&String(c.user_id)===String(account.id))?account.avatar:(prof.avatar||c.avatar||null);
      const s=ensureSocial(c.post_id); const obj={id:c.id,userId:c.user_id,user:prof.username||c.username||'Member',avatar:liveAvatar,nameColor:c.name_color||null,body:c.body,ts:new Date(c.created_at).getTime(),edited:!!c.edited_at,parentId:c.parent_id||null,reactions:{},mine:null}; s.comments.push(obj); cIndex[c.id]=obj; });
    rx.forEach(function(r){ const store=cIndex[r.target_id]||ensureSocial(r.target_id); store.reactions[r.emoji]=(store.reactions[r.emoji]||0)+1; if(account&&String(r.user_id)===String(account.id)) store.mine=r.emoji; });
  }catch(e){}
}
// save/remove the current user's reaction on a target (a post id OR a comment id)
function persistReaction(targetId,emoji){
  if(!BACKEND||!account) return;
  const fail=function(e){ toast('Reaction didn\u2019t save — '+((e&&e.message)||'try again'),'err'); };
  try{
    if(emoji==null){ sb.from('post_reactions').delete().eq('target_id',targetId).eq('user_id',account.id).then(function(){},fail); }
    else { sb.from('post_reactions').upsert({target_id:targetId,user_id:account.id,emoji:emoji},{onConflict:'target_id,user_id'}).then(function(){},fail); }
  }catch(e){ fail(e); }
}
// may the current viewer edit/delete THIS comment? its author, or a role with the comment_moderate permission
function canModerateComment(c){ return isLoggedIn() && ((c && c.userId && account && String(c.userId)===String(account.id)) || can('comment_moderate')); }
function totalReactions(r){ let t=0; for(const k in r) t+=r[k]; return t; }
function applyReaction(store,emoji){
  if(!store.reactions)store.reactions={};
  if(store.mine===emoji){ store.reactions[emoji]=(store.reactions[emoji]||1)-1; if(store.reactions[emoji]<=0)delete store.reactions[emoji]; store.mine=null; }
  else { if(store.mine){ store.reactions[store.mine]=(store.reactions[store.mine]||1)-1; if(store.reactions[store.mine]<=0)delete store.reactions[store.mine]; } store.reactions[emoji]=(store.reactions[emoji]||0)+1; store.mine=emoji; }
}
function reactionChips(store, onclickPrefix){
  const entries=Object.keys(store.reactions||{}).map(function(k){return [k,store.reactions[k]];}).filter(function(e){return e[1]>0;}).sort(function(a,b){return b[1]-a[1];});
  if(!entries.length) return '';
  return '<span class="rx-shown">'+entries.slice(0,3).map(function(e){ const on=store.mine===e[0]?' on':''; return '<span class="rx-chip'+on+'" onclick="'+onclickPrefix+'\''+e[0]+'\')"><span class="rx-e">'+e[0]+'</span><span class="rx-c">'+e[1]+'</span></span>'; }).join('')+'</span>';
}

function gStep(id,dir,ev){

const memberSinceCache={};   // profiles.id -> created_at; feeds the little "member since" badges on comment cards
function hydrateMemberSince(){
  if(!BACKEND)return;
  const els=Array.prototype.slice.call(document.querySelectorAll('.ms-badge[data-uid]:not([data-done])'));
  if(!els.length)return;
  const ids=[];
  els.forEach(function(e){ const u=e.getAttribute('data-uid'); e.setAttribute('data-done','1'); if(u&&ids.indexOf(u)<0&&!(u in memberSinceCache)) ids.push(u); });
  const paint=function(){
    document.querySelectorAll('.ms-badge[data-uid]').forEach(function(e){
      const s=memberSinceCache[e.getAttribute('data-uid')]; if(!s||e.getAttribute('data-has'))return;
      const y=new Date(s).getFullYear(); if(!y||isNaN(y))return;
      e.innerHTML=ICONS.leaf+'<span>'+y+'</span>'; e.setAttribute('data-has','1'); e.setAttribute('data-tip','Member since '+y);
    });
  };
  if(!ids.length){ paint(); return; }
  sb.from('profiles').select('id,created_at').in('id',ids).then(function(res){
    (res.data||[]).forEach(function(p){ memberSinceCache[p.id]=p.created_at; });
    paint();
  }).catch(function(){});
}
async function openMemberProfile(userId,name){

      '<div class="skl skl-line" style="width:45%"></div><p class="muted" style="margin:8px 0 0">Loading profile\u2026</p></div>');
    /* 2.8: one RPC returns the whole card (role, color, joined, online status, comment count) */
    try{ const {data,error}=await sb.rpc('get_member_profile',{p_uid:userId});
      const d=(data&&typeof data==='string')?JSON.parse(data):data;
      if(!error&&d&&d.username){ nm=d.username||nm; av=d.avatar||null; role=d.role||''; country=d.country||''; nc=d.name_color||null;

/* ---- gallery photo crop: zoom + drag into a square, one photo at a time (same idea as the profile picture) ---- */
const GC_SIZE=300, GC_OUT=800;
let _gc=null, _gcQueue=[];
function galleryCropQueue(dataUrls){ _gcQueue=(dataUrls||[]).slice(); gcNext(); }
function gcNext(){ if(!_gcQueue.length){ _gc=null; renderGalleryEditor(); return; } openGalleryCrop(_gcQueue.shift()); }
function openGalleryCrop(src){
  const remaining=_gcQueue.length;
  openModal('<button class="x" onclick="gcCancelAll()" aria-label="Close">\u00d7</button>'+
    '<h3>Crop photo'+(remaining?' <span class="muted" style="font-size:.68em;font-weight:400">'+(remaining+1)+' to go</span>':'')+'</h3>'+
    '<p class="muted" style="margin:2px 0 12px;font-size:.85rem">Drag to move, use the slider to zoom \u2014 it\u2019s shown as a square.</p>'+
    '<div class="gc-stage"><canvas id="gc-canvas" width="'+GC_SIZE+'" height="'+GC_SIZE+'"></canvas></div>'+
    '<label style="margin-top:10px">Zoom</label><input id="gc-zoom" class="av-zoom" type="range" min="1" max="3" step="0.01" value="1" oninput="gcZoom(this.value)">'+
    '<div style="display:flex;gap:10px;margin-top:14px"><button class="btn btn-primary" style="flex:1" onclick="gcAdd()">Add photo</button><button class="btn btn-ghost" style="flex:1" onclick="gcSkip()">Skip</button></div>');
  const cv=document.getElementById('gc-canvas'); if(cv){ cv.addEventListener('mousedown',gcDragStart); cv.addEventListener('touchstart',gcDragStart,{passive:false}); }
  gcLoadSrc(src);
}
function gcLoadSrc(src){ const img=new Image(); img.onload=function(){ const base=Math.max(GC_SIZE/img.width, GC_SIZE/img.height); _gc={img:img,base:base,scale:1,x:(GC_SIZE-img.width*base)/2,y:(GC_SIZE-img.height*base)/2,drag:null}; const z=document.getElementById('gc-zoom'); if(z)z.value=1; gcDraw(); }; img.src=src; }
function gcClamp(){ if(!_gc)return; const s=_gc.base*_gc.scale, w=_gc.img.width*s, h=_gc.img.height*s; _gc.x=Math.min(0,Math.max(GC_SIZE-w,_gc.x)); _gc.y=Math.min(0,Math.max(GC_SIZE-h,_gc.y)); }
function gcDraw(){ const c=document.getElementById('gc-canvas'); if(!c||!_gc)return; const g=c.getContext('2d'); g.clearRect(0,0,GC_SIZE,GC_SIZE); const s=_gc.base*_gc.scale; g.drawImage(_gc.img,_gc.x,_gc.y,_gc.img.width*s,_gc.img.height*s); }
function gcZoom(val){ if(!_gc)return; const mid=GC_SIZE/2, old=_gc.base*_gc.scale; _gc.scale=parseFloat(val)||1; const now=_gc.base*_gc.scale; _gc.x=mid-(mid-_gc.x)*(now/old); _gc.y=mid-(mid-_gc.y)*(now/old); gcClamp(); gcDraw(); }
function gcPt(e){ const r=document.getElementById('gc-canvas').getBoundingClientRect(); const t=(e.touches&&e.touches[0])||e; return {x:(t.clientX-r.left)*(GC_SIZE/r.width), y:(t.clientY-r.top)*(GC_SIZE/r.height)}; }
function gcDragStart(e){ if(!_gc)return; e.preventDefault(); const p=gcPt(e); _gc.drag={x:p.x-_gc.x,y:p.y-_gc.y}; window.addEventListener('mousemove',gcDragMove); window.addEventListener('mouseup',gcDragEnd); window.addEventListener('touchmove',gcDragMove,{passive:false}); window.addEventListener('touchend',gcDragEnd); }
function gcDragMove(e){ if(!_gc||!_gc.drag)return; e.preventDefault(); const p=gcPt(e); _gc.x=p.x-_gc.drag.x; _gc.y=p.y-_gc.drag.y; gcClamp(); gcDraw(); }
function gcDragEnd(){ if(_gc)_gc.drag=null; window.removeEventListener('mousemove',gcDragMove); window.removeEventListener('mouseup',gcDragEnd); window.removeEventListener('touchmove',gcDragMove); window.removeEventListener('touchend',gcDragEnd); }
function gcExport(){ if(!_gc)return null; const o=document.createElement('canvas'); o.width=GC_OUT; o.height=GC_OUT; const g=o.getContext('2d'), k=GC_OUT/GC_SIZE, s=_gc.base*_gc.scale; g.drawImage(_gc.img,_gc.x*k,_gc.y*k,_gc.img.width*s*k,_gc.img.height*s*k); try{ return o.toDataURL('image/jpeg',0.85); }catch(e){ return null; } }
function gcAdd(){ const d=gcExport(); if(d && _gEd){ _gEd.photos.push(d); } gcNext(); }
function gcSkip(){ gcNext(); }
function gcCancelAll(){ _gcQueue=[]; _gc=null; renderGalleryEditor(); }
// downscale before storing, so a post of 15 photos doesn't balloon the saved row
function shrinkImage(file, cb, maxDim, quality){
  maxDim=maxDim||1400; quality=quality||0.85;
  const rd=new FileReader();
  rd.onload=function(){ const img=new Image();
    img.onload=function(){ const sc=Math.min(1, maxDim/Math.max(img.width,img.height));
      const c=document.createElement('canvas'); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      try{ cb(c.toDataURL('image/jpeg',quality)); }catch(e){ cb(rd.result); } };
    img.onerror=function(){ cb(null); }; img.src=rd.result; };
  rd.onerror=function(){ cb(null); };
  rd.readAsDataURL(file);
}

/* --- turn an event into a calendar link / file (no server needed) --- */
function _pad2(n){ n=String(n); return n.length<2?'0'+n:n; }
function _icsUTC(d){ return d.getUTCFullYear()+_pad2(d.getUTCMonth()+1)+_pad2(d.getUTCDate())+'T'+_pad2(d.getUTCHours())+_pad2(d.getUTCMinutes())+_pad2(d.getUTCSeconds())+'Z'; }
function _nextDayCompact(dateStr){ const d=new Date(dateStr+'T00:00'); d.setDate(d.getDate()+1); return d.getFullYear()+_pad2(d.getMonth()+1)+_pad2(d.getDate()); }
function eventWhen(e){
  if(e.time){ const s=new Date(e.date+'T'+e.time); return { allDay:false, start:s, end:new Date(s.getTime()+3600000) }; }   // 1-hour default
  return { allDay:true, start:(e.date||'').replace(/-/g,''), end:_nextDayCompact(e.date) };
}
function gcalUrl(e){
  if(!e) return 'https://calendar.google.com/';
  const w=eventWhen(e);
  const dates=w.allDay?(w.start+'/'+w.end):(_icsUTC(w.start)+'/'+_icsUTC(w.end));
  const det=(e.details||'')+(e.link?('\n'+e.link):'')+'\n\nvia Earth Sweet Earth';
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE'+
    '&text='+encodeURIComponent(e.name||'Earth Sweet Earth event')+
    '&dates='+dates+
    '&details='+encodeURIComponent(det);
}
function eventIcs(e){
  const w=eventWhen(e);
  const enc=function(s){ return String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n'); };
  const start=w.allDay?('DTSTART;VALUE=DATE:'+w.start):('DTSTART:'+_icsUTC(w.start));
  const end=w.allDay?('DTEND;VALUE=DATE:'+w.end):('DTEND:'+_icsUTC(w.end));
  const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Earth Sweet Earth//Events//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH',
    'BEGIN:VEVENT','UID:'+encodeURIComponent(String(e.id))+'@earthsweetearth.org','DTSTAMP:'+_icsUTC(new Date()),
    start,end,'SUMMARY:'+enc(e.name||'Earth Sweet Earth event')];
  if(e.details||e.link) lines.push('DESCRIPTION:'+enc((e.details||'')+(e.link?('\n'+e.link):'')));
  if(!w.allDay) lines.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+enc(e.name||'Reminder'),'TRIGGER:-PT1H','END:VALARM');
  lines.push('END:VEVENT','END:VCALENDAR');
  return lines.join('\r\n');
}
function downloadEventIcs(eid){
  const e=findEventById(String(eid)); if(!e) return;
  try{
    const blob=new Blob([eventIcs(e)],{type:'text/calendar;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url;
    a.download=(String(e.name||'event').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')||'event')+'.ics';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); },3000);
    closeModal(); toast('Saved to your calendar app \ud83d\udcc5');
  }catch(err){ toast('Couldn\u2019t create the calendar file.'); }
}

function statCard(label,val,sub,onClick,spark){ return '<div class="stat-card'+(onClick?' stat-clickable':'')+'"'+(onClick?' role="button" tabindex="0" onclick="'+onClick+'" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();'+onClick+'}"':'')+'><div class="stat-val">'+val+'</div><div class="stat-lab">'+esc(label)+(onClick?' <span class="stat-more" aria-hidden="true">›</span>':'')+'</div>'+(sub?'<div class="stat-sub">'+esc(sub)+'</div>':'')+(spark&&spark.length>1?sparkSVG(spark):'')+'</div>'; }
function sparkSVG(arr){ const mx=Math.max.apply(null,arr.concat([1])), w=120, h=30;
  const pts=arr.map(function(v,i){ return (i/(arr.length-1)*w).toFixed(1)+','+(h-3-(v/mx)*(h-8)).toFixed(1); }).join(' ');
  return '<svg class="spark" viewBox="0 0 120 30" preserveAspectRatio="none" aria-hidden="true"><polyline points="'+pts+'" fill="none" stroke="var(--green)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>'; }
function countUpStats(root){ ((root)||document).querySelectorAll('.stat-val').forEach(function(el){
  const t=(el.textContent||'').trim(); if(!/^\d+$/.test(t)||el._cu) return; el._cu=1;
  const n=parseInt(t,10), st=performance.now(), dur=850;
  (function fr(now){ const k=Math.min(1,(now-st)/dur), e=1-Math.pow(1-k,3); el.textContent=String(Math.round(n*e)); if(k<1) requestAnimationFrame(fr); })(st);
}); }

let memberResults=null, memberQuery='';
async function searchMembers(){
  const el=document.getElementById('mem-q'); const q=el?el.value.trim():'';
  memberQuery=q;
  if(!q){ memberResults=null; render(); return; }
  if(!BACKEND){ memberResults=people.filter(p=>(p.email||'').toLowerCase().includes(q.toLowerCase())||(p.username||'').toLowerCase().includes(q.toLowerCase())); render(); return; }
  try{
    const safeQ=q.replace(/[(),]/g,' ').trim();
    const pattern='%'+safeQ+'%';
    const {data,error}=await sb.from('profiles').select('id,username,email,role,is_developer,country').or('email.ilike.'+pattern+',username.ilike.'+pattern).limit(30);
    if(error){ toast('Search error: '+error.message); memberResults=[]; }
    else memberResults=(data||[]).map(r=>({id:r.id,username:r.username||'(member)',email:r.email||'',roleId:r.role||'member',isDeveloper:!!r.is_developer,country:r.country||''}));
  }catch(e){ memberResults=[]; toast('Search failed — is the profiles table set up?'); }
  render();
}
function stageMemberRole(id,rid){ const m=(memberResults||[]).find(x=>String(x.id)===String(id)); if(m){ m._newRole=rid; render(); } }
async function saveMemberRole(id){
  const m=(memberResults||[]).find(x=>String(x.id)===String(id)); if(!m)return;
  const rid=m._newRole||m.roleId; const rn=roles[rid]?roles[rid].name:rid;
  if(!BACKEND){ m.roleId=rid; delete m._newRole; toast('Saved (preview): '+m.email+' → '+rn); render(); return; }
  try{ const {error}=await sb.from('profiles').update({role:rid}).eq('id',m.id);
    if(error) toast('Save failed: '+error.message);
    else { m.roleId=rid; delete m._newRole; toast('Saved: '+m.email+' is now '+rn); }
  }catch(e){ toast('Save failed'); }
  render();
}
/* the owner (or an existing developer) can appoint developers; only the owner can REMOVE developer powers */
async function toggleDeveloper(id){
  if(!isDev() && !isOwner()){ toast('Only the owner can change developers','err'); return; }
  const m=(memberResults||[]).find(x=>String(x.id)===String(id)); if(!m)return;
  const target=!m.isDeveloper;
  if(!target && !isMainDev()){ toast('Only the owner can remove developer powers','err'); return; }
  try{ const {error}=await sb.from('profiles').update({is_developer:target}).eq('id',m.id);
    if(error){ toast('Save failed: '+error.message); return; }
    m.isDeveloper=target; toast(target?(m.username+' is now a developer'):(m.username+' is no longer a developer'));
  }catch(e){ toast('Save failed'); }
  render();
}

async function doDeleteUser(id){

async function doChangePassword(){
  const err=document.getElementById('cp-err'),b=document.getElementById('cp-btn');
  const oldPw=document.getElementById('cp-old').value,np=document.getElementById('cp-new').value,np2=document.getElementById('cp-new2').value;
  err.textContent='';
  if(!pwValid(np)){ err.textContent='The new password needs at least 5 characters, including a number and a symbol.'; return; }
  if(np!==np2){ err.textContent='The two new passwords don\u2019t match.'; return; }
  if(np===oldPw){ err.textContent='The new password must be different from your current one.'; return; }
  b.disabled=true;b.textContent='Updating\u2026';
  if(BACKEND){
    try{
      /* verify the current password first — a new password can never be set without it */
      const {error:vErr}=await sb.auth.signInWithPassword({email:account.email,password:oldPw});
      if(vErr){ b.disabled=false;b.innerHTML=ICONS.key+' Update password'; err.textContent='Your current password is incorrect.'; return; }

      if(error){ b.disabled=false;b.innerHTML=ICONS.key+' Update password'; err.textContent=error.message||'Couldn\u2019t update the password. Please try again.'; return; }
    }catch(e){ b.disabled=false;b.innerHTML=ICONS.key+' Update password'; err.textContent='Something went wrong. Please try again.'; return; }
  }
  closeModal();
  toast(BACKEND?'Password updated':'Password updated (preview)');
}

/* drag-to-reorder: entries can be dragged into a new position (arrow buttons work on touch) */
function clMove(from,to){
  const list=clEntries().slice();
  if(from===to||from<0||from>=list.length||to<0||to>=list.length) return;
  const moved=list.splice(from,1)[0];

}

/* ---- leader chat: clean little room for moderators+ (DB keeps the newest 30; a trigger deletes the oldest) ---- */
let leaderMsgs=null, leaderPeeps=null, leaderRx={}, _ldReplyTo=null;
const LD_EMOJIS=['❤️','👍','😂','😮','🙏','✅'];
const LEADER_INFO_DEFAULT='A quiet place for moderators, admins, owners and developers to talk. To save storage, the oldest message is removed once the room passes 30.';
async function loadLeaderMsgs(){
  leaderRx={};
  if(!BACKEND){ leaderMsgs=[]; return; }
  try{
    const res=await Promise.all([
      sb.from('leader_messages').select('id,user_id,username,name_color,body,reply_to,reply_to_name,created_at').order('created_at',{ascending:true}).limit(30),
      sb.from('leader_msg_reactions').select('message_id,user_id,emoji')
    ]);
    if(res[0]&&!res[0].error){
      leaderMsgs=(res[0].data)||[];
      const ids=[...new Set(leaderMsgs.map(function(m){return m.user_id;}).filter(Boolean))];
      if(ids.length){
        try{ const pr=await sb.from('profiles').select('id,avatar,username,name_color').in('id',ids);
          if(pr.error) throw pr.error;
          const byId={}; (pr.data||[]).forEach(function(p){byId[String(p.id)]=p;});
          leaderMsgs.forEach(function(m){
            const p=byId[String(m.user_id)];
            if(p){
              /* Profiles are the source of truth for current chat identity. */
              m.avatar=p.avatar||null;
              m.username=p.username||m.username;
              m.name_color=p.name_color||null;
            }
          });
        }catch(e){}
      }
    }
    ((res[1]&&res[1].data)||[]).forEach(function(r){
      const o=leaderRx[r.message_id]=leaderRx[r.message_id]||{counts:{},mine:{}};
      o.counts[r.emoji]=(o.counts[r.emoji]||0)+1;
      if(account&&String(r.user_id)===String(account.id)) o.mine[r.emoji]=1;
    });
  }catch(e){ leaderMsgs=[]; }
}
function ldReply(id){ const m=(leaderMsgs||[]).find(function(x){ return String(x.id)===String(id); }); _ldReplyTo=m?{id:id,name:(m.username||'Member')}:null; render(); const inp=document.getElementById('ld-in'); if(inp)inp.focus(); }
async function loadLeaderPeeps(){ if(!BACKEND){ leaderPeeps=[]; return; } try{ const {data,error}=await sb.from('profiles').select('id,username,role,name_color,avatar,last_seen').in('role',['moderator','admin','owner','developer']).limit(60); if(!error) leaderPeeps=(data||[]); }catch(e){ if(!leaderPeeps) leaderPeeps=[]; } }
function ldPeepRow(p){
  const on=!!(p.last_seen&&(new Date(p.last_seen).getTime()>Date.now()-120000));
  const col=(p.name_color&&NAME_COLORS[p.name_color])?NAME_COLORS[p.name_color]:null;
  const av=p.avatar?'<img class="ld-pav" src="'+escA(p.avatar)+'" alt="">':'<span class="ld-pav">'+avLetterImg((p.username||'?').charAt(0).toUpperCase())+'</span>';
  const rl=(roles[p.role]&&roles[p.role].name)||p.role||'';
  return '<div class="ld-peep">'+av+'<div class="who"><b'+(col?' style="color:'+col+'"':'')+'>'+esc(p.username||'Member')+'</b><span class="rl">'+esc(rl)+'</span></div>'+
    '<div class="mp-status">'+(on?'<span class="mp-on"><i></i>Active</span>':'<span class="mp-off"><i></i>Offline</span>')+'</div></div>';

function ldSideHtml(){
  const ps=leaderPeeps;
  if(ps===null) return '<p class="muted" style="font-size:.85rem;padding:8px 2px">Loading\u2026</p>';
  const now=Date.now();
  const rank={developer:6,owner:5,admin:4,moderator:3};
  const rows=ps.slice().sort(function(a,b){
    const oa=(a.last_seen&&new Date(a.last_seen).getTime()>now-120000)?1:0, ob=(b.last_seen&&new Date(b.last_seen).getTime()>now-120000)?1:0;
    if(oa!==ob) return ob-oa;
    const ra=rank[a.role]||0, rb=rank[b.role]||0; if(ra!==rb) return rb-ra;
    return String(a.username||'').localeCompare(String(b.username||''));
  });
  const online=rows.filter(function(p){ return p.last_seen&&new Date(p.last_seen).getTime()>now-120000; }).length;
  return '<p class="sub">'+online+' of '+rows.length+' active</p>'+ (rows.length?rows.map(ldPeepRow).join(''):'<p class="muted" style="font-size:.85rem">No leaders yet</p>');
}
function ldCancelReply(){ _ldReplyTo=null; render(); const inp=document.getElementById('ld-in'); if(inp)inp.focus(); }
async function ldReact(mid,emoji){
  if(!BACKEND||!account){ toast('Log in to react','err'); return; }
  const o=leaderRx[mid]=leaderRx[mid]||{counts:{},mine:{}};
  const on=!!o.mine[emoji];
  if(on){ delete o.mine[emoji]; o.counts[emoji]=Math.max(0,(o.counts[emoji]||1)-1); if(!o.counts[emoji]) delete o.counts[emoji]; }
  else { o.mine[emoji]=1; o.counts[emoji]=(o.counts[emoji]||0)+1; }
  render();
  try{

function fitChapterTitle(){
  const el=document.getElementById('chapTitle'); if(!el)return;
  const tips=el.querySelectorAll('.info .tip'); tips.forEach(function(t){t.style.display='none';});   // the tooltip must not inflate the measured width
  const parent=el.parentElement, cs=getComputedStyle(parent);
  const avail=(parent.clientWidth - parseFloat(cs.paddingLeft||0) - parseFloat(cs.paddingRight||0)) * 0.96;   // fit within ~96% of the width
  const MIN=32, MAX=44;
  el.style.whiteSpace='nowrap';
  let size=MAX; el.style.fontSize=size+'px';
  let guard=0;
  while(el.scrollWidth>avail && size>MIN && guard++<320){ size-=1; el.style.fontSize=size+'px'; }
  if(el.scrollWidth>avail) el.style.whiteSpace='normal';       // still too wide at min size -> let it wrap so it stays readable (not tiny)
  tips.forEach(function(t){t.style.display='';});
}
// Keep the hero tagline to exactly two lines in every language: shrink the font until both phrases fit on their own line
// (longer translations, e.g. Chinese, end up a little smaller). Runs after the hero renders, on resize, and after a language switch.
function fitTagline(){
  const inner=document.querySelector('.hero-content .tagline'); if(!inner)return;
  inner.style.fontSize='';                                      // reset to the CSS size (a viewport-width clamp) as the ceiling
  let size=parseFloat(getComputedStyle(inner).fontSize)||24;
  const MIN=Math.max(13,size*0.5);
  const lineCount=function(){ const lh=parseFloat(getComputedStyle(inner).lineHeight)||size*1.55; return Math.round(inner.scrollHeight/lh); };
  let guard=0;
  while(lineCount()>2 && size>MIN && guard++<240){ size-=0.5; inner.style.fontSize=size+'px'; }
}
let _tagFitBound=false;
function bindTagFit(){ if(_tagFitBound)return; _tagFitBound=true; let t; window.addEventListener('resize',function(){ clearTimeout(t); t=setTimeout(fitTagline,120); }); }

function randToken(){

  let L;

/* ---- translation engine (cache-first; Edge Function, then MyMemory fallback) ---- */
async function preloadTranslations(code){
  if(code==='en'||!BACKEND) return;
  transCache[code]=transCache[code]||{};
  try{ const {data}=await sb.from('translations').select('source_text,translated').eq('target',code);
    (data||[]).forEach(function(r){ transCache[code][r.source_text]=r.translated; }); }catch(e){}
}

let _edgeXlate=(typeof BACKEND!=='undefined'&&BACKEND);   // Edge Function available? disabled after a failure
async function gtxTranslate(text, target){
  const url='https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl='+encodeURIComponent(target)+'&dt=t&q='+encodeURIComponent(text);
  const r=await fetch(url); if(!r.ok) throw new Error('gtx '+r.status);
  const j=await r.json(); return (j[0]||[]).map(function(s){return s[0];}).join('');
}
async function translateBatch(texts, target){
  if(target==='en') return;
  const cache=transCache[target]||(transCache[target]={});
  const todo=[]; texts.forEach(function(t){ if(t&&cache[t]==null&&todo.indexOf(t)<0) todo.push(t); });
  if(!todo.length) return;
  // 1) Edge Function (Claude, context-aware; cached in the DB so results are identical every time)
  if(_edgeXlate){
    try{
      const L=LANGS.find(function(x){return x.code===target;});
      const {data,error}=await sb.functions.invoke('translate',{body:{q:todo,target:target,source:'en',targetName:(L&&L.name)||target}});
      if(!error && data && data.translations){ todo.forEach(function(t,i){ if(data.translations[i]!=null) cache[t]=data.translations[i]; }); }
      else { _edgeXlate=false; }
    }catch(e){ _edgeXlate=false; }
  }
  // 2) fallback only if the Edge Function is unavailable: Google endpoint directly, in parallel
  //    (MyMemory was removed — it produced low-quality junk)
  let still=todo.filter(function(t){return cache[t]==null;});
  if(still.length){
    await Promise.all(still.map(function(t){ return gtxTranslate(t,target).then(function(tr){ if(tr)cache[t]=tr; },function(){}); }));
  }
}

/* ---- apply translations to whatever is on screen (skips [data-notranslate]) ---- */
function txReplace(node,tr){ const v=node.nodeValue, lead=(v.match(/^\s*/)||[''])[0], trail=(v.match(/\s*$/)||[''])[0]; node.nodeValue=lead+tr+trail; }
function txCollect(root){
  const out=[]; if(!root) return out;
  const w=document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  let n; while(n=w.nextNode()){
    const val=n.nodeValue; if(!val||!val.trim()) continue;
    if(/^[\s\d.,:;/#%()\[\]\-–—•|+×✓✕→←↗▾★☆]*$/.test(val)) continue;
    const p=n.parentElement; if(!p) continue;
    const tag=p.tagName; if(tag==='SCRIPT'||tag==='STYLE'||tag==='TEXTAREA'||tag==='CODE') continue;
    if(p.closest('[data-notranslate]')) continue;
    out.push(n);
  }
  return out;
}
let _txRun=0;
async function applyTranslations(){
  if(lang==='en'||!langChosen) return;
  const myRun=++_txRun;
  const roots=[document.getElementById('app'),document.getElementById('modal'),document.querySelector('.topbar'),document.getElementById('footer')];   // translate the nav + footer too, not just page content
  let nodes=[]; roots.forEach(function(r){ nodes=nodes.concat(txCollect(r)); });
  const cache=transCache[lang]||(transCache[lang]={});
  const pending=[], need=[];
  nodes.forEach(function(n){ const k=n.nodeValue.trim(); if(cache[k]!=null){ txReplace(n,cache[k]); } else { pending.push({n:n,k:k}); if(need.indexOf(k)<0)need.push(k); } });
  const attrPending=[];
  roots.forEach(function(r){ if(!r)return; Array.prototype.forEach.call(r.querySelectorAll('[placeholder],[title]'),function(el){
    ['placeholder','title'].forEach(function(a){ const val=el.getAttribute(a); if(val&&val.trim()&&!/^[\s\d]*$/.test(val)&&!el.closest('[data-notranslate]')){ if(cache[val]!=null)el.setAttribute(a,cache[val]); else{ attrPending.push({el:el,a:a,k:val}); if(need.indexOf(val)<0)need.push(val);} } }); }); });
  translateWordmark();
  if(!need.length){ try{fitTagline();}catch(e){} return; }   // all cached: re-fit the (now translated) tagline to 2 lines
  await translateBatch(need, lang);
  if(myRun!==_txRun) return;
  pending.forEach(function(p){ if(cache[p.k]!=null && p.n.parentNode && p.n.nodeValue.trim()===p.k) txReplace(p.n,cache[p.k]); });
  attrPending.forEach(function(p){ if(cache[p.k]!=null && p.el.getAttribute(p.a)===p.k) p.el.setAttribute(p.a,cache[p.k]); });
  try{fitTagline();}catch(e){}
}

}

function liFrame(now){
  if(!liActive) return;
  const bg=document.getElementById('liBg'); if(!bg) return;
  const dt=Math.min(64, now-liLast); liLast=now;
  liSpawn-=dt; if(liSpawn<=0 && liLetters.length<42){ liSpawn=230+Math.random()*280; liSpawnLetter(bg); }
  for(let i=liLetters.length-1;i>=0;i--){ const L=liLetters[i];
    L.x+=L.vx*dt; L.y+=L.vy*dt; L.life+=dt;
    const fin=Math.min(1,L.life/1500), fout=(L.life>L.hold)?Math.max(0,1-(L.life-L.hold)/1500):1;
    L.el.style.transform='translate('+L.x.toFixed(1)+'px,'+L.y.toFixed(1)+'px)';
    L.el.style.opacity=(Math.min(fin,fout)*L.max).toFixed(3);
    if(L.life>L.hold+1500){ if(L.el.parentNode)bg.removeChild(L.el); liLetters.splice(i,1); }
  }
  liRAF=requestAnimationFrame(liFrame);

const LEAF_PATH='M0,-8 C4,-6 5,-1 3,5 C2,7.5 -2,7.5 -3,5 C-5,-1 -4,-6 0,-8 Z';

// deterministic pseudo-random so the canopy is identical every load
function fr(x){x=Math.sin(x)*43758.5453;return x-Math.floor(x);}
// leaves densely fill a rounded crown (no floating gaps); a ragged edge keeps it natural
const LEAF_POS=(function(){const a=[];const cx=100,cy=82,rx=72,ry=58,step=8;let k=0;
  for(let gy=cy-ry;gy<=cy+ry;gy+=step){for(let gx=cx-rx;gx<=cx+rx;gx+=step){
    const jx=(fr(k*1.7)-0.5)*step*1.0, jy=(fr(k*3.3+1)-0.5)*step*1.0;
    const x=gx+jx, y=gy+jy, nx=(x-cx)/rx, ny=(y-cy)/ry, dist=nx*nx+ny*ny;
    if(dist<=1 && !(dist>0.9 && fr(k*5.1)<0.3)){                          // dense fill, lightly ragged edge
      const lx=100+(fr(k*8.1)-0.5)*116;                                  // land spread across a mound at the base
      const mh=14*Math.max(0,1-Math.pow(Math.abs(lx-100)/56,1.4)) - fr(k*9.3)*6;   // mound height above the ground line (peak centre)
      a.push({x:+x.toFixed(1),y:+y.toFixed(1),r:Math.round(fr(k*2.2)*360),d:Math.min(0.34,Math.max(0,(y-(cy-ry))/(2*ry)*0.32)),dt:+fr(k*11.3).toFixed(3),lx:+lx.toFixed(1),mh:+mh.toFixed(1),lr:Math.round(fr(k*3.7)*160-80)});

// flowers scatter more sparsely through the same crown, in front of the leaves
const FLOWER_POS=(function(){const a=[];const cx=100,cy=82,rx=64,ry=50,step=15;let k=0;
  for(let gy=cy-ry;gy<=cy+ry;gy+=step){for(let gx=cx-rx;gx<=cx+rx;gx+=step){
    const jx=(fr(k*4.1+7)-0.5)*step, jy=(fr(k*6.7+3)-0.5)*step;
    const x=gx+jx, y=gy+jy, nx=(x-cx)/rx, ny=(y-cy)/ry;

// sun/moon vertical placement, measured from the real horizon (hills) so it sits right on any screen
let heroW=0, heroH=0, curP=0, groundY=0, trunkLX=0, trunkRX=0, GROUND_TY=200, canopyY=0, skyY=0, hs=1;
function measureHero(){
  const hero=document.getElementById('hero'); if(!hero)return;
  heroW=hero.clientWidth; heroH=hero.clientHeight;
  const vh=window.innerHeight||heroH;
  const tb=document.querySelector('.topbar'); if(tb) document.documentElement.style.setProperty('--nav-h', tb.offsetHeight+'px');
  // Ground/sky lines from the known vh-based hill sizes — deterministic (getBoundingClientRect on the SVGs was unreliable and put the shadows at the top).
  groundY = heroH - 0.166*vh;                        // front-hill green top (23vh box, green begins ~28% down it)
  skyY    = heroH - 0.258*vh;                        // far light-green hill ridge (34vh box) — the sun sets behind this
  hs = Math.max(0.45, Math.min(1, heroW/1280));     // proportional scale: full on a laptop, smaller on phones/tablets
  hero.style.setProperty('--hs', hs.toFixed(3));
  trunkLX = 89; trunkRX = heroW - 89;                // trunk sits at each tree's horizontal centre (≈89px), unchanged by scaling (trees scale about bottom-centre)
  const contentH=Math.min(0.44*vh, 190*320/200), topPx=heroH-contentH;   // tree content (unscaled); trees scale about the ground line so this crossing stays put
  GROUND_TY = Math.max(40, Math.min(300, (groundY - topPx)/contentH*320));   // viewBox-y where the trunk meets the grass — unchanged by scaling
  const canopyU = topPx + (48/320)*contentH;
  canopyY = groundY - hs*(groundY - canopyU);        // top of the crown, scaled about the ground line
}

function seasonColor(p){ return p<0.32 ? mix('#3f8f4f','#c9a227',p/0.32) : mix('#c9a227','#c0472b',Math.min(1,(p-0.32)/0.22)); }

let leavesFalling=false;
