<!-- Supabase library — powers real accounts once you add your keys (CONFIG block in the script). -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  :root{
    --green:#007600; --green-dk:#005800;
    --blue:#2083C4;  --blue-dk:#186098;
    --bg:#D5E3DA; --card:#ffffff; --ink:#20302a; --muted:#5f7168; --line:#c4d6cb;
    --sun:#F4C430;
    --on-green:#ffffff; --on-blue:#ffffff; --danger:#c0392b; --danger-dk:#a5301f;   /* text-on-colored-button + danger, theme-aware below */
    --maxw:1200px;
  }
  [data-theme="dark"]{
    --green:#49b76e; --green-dk:#3aa05e;
    --blue:#5cb3ea;  --blue-dk:#3f97cf;
    --bg:#0e1720; --card:#17222c; --ink:#e7eef3; --muted:#9db0bb; --line:#2a3742;
    --on-green:#07130c; --on-blue:#06121c; --danger:#e0574a; --danger-dk:#c8402f;   /* dark: greens/blues lighten, so button text goes dark for contrast */
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;overflow-x:hidden;min-height:100vh;display:flex;flex-direction:column;font-family:"Gelasio",Georgia,"Times New Roman",serif;
    color:var(--ink);background:var(--bg);line-height:1.6;-webkit-font-smoothing:antialiased;
    transition:background .3s ease,color .3s ease;}
  #app{flex:1 0 auto;}
  footer{flex-shrink:0;}
  h1,h2,h3{font-family:"Gelasio",Georgia,serif;line-height:1.1;margin:0;color:var(--green);}
  p{margin:0 0 1rem;}
  a{color:var(--blue);}
  img{max-width:100%;display:block;}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 clamp(30px,5vw,56px);}

  a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px;}
  .skip{position:absolute;left:16px;top:-60px;background:var(--green);color:#fff;padding:10px 18px;border-radius:8px;font-weight:600;z-index:200;transition:top .2s;}
  .skip:focus{top:70px;}

  /* buttons */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;font-weight:600;font-size:.96rem;padding:11px 20px;border-radius:10px;text-decoration:none;cursor:pointer;border:2px solid transparent;transition:transform .15s,background .2s,color .2s,border-color .2s;}
  .btn-primary{background:linear-gradient(180deg,var(--green),var(--green-dk));color:var(--on-green);border-bottom-color:rgba(0,40,0,.25);}
  .btn-primary:hover{background:var(--green-dk);transform:translateY(-2px);}
  .btn-blue{background:var(--blue);color:var(--on-blue);}
  .btn-blue:hover{background:var(--blue-dk);transform:translateY(-2px);}
  .btn-ghost{background:transparent;border-color:var(--blue);color:var(--blue);}
  .btn-ghost:hover{background:var(--blue);color:var(--on-blue);transform:translateY(-2px);}
  .btn-sm{padding:8px 16px;font-size:.88rem;}
  .btn-xs{padding:5px 12px;font-size:.8rem;border-width:1.5px;border-radius:8px;}
  .btn-danger{background:var(--danger);color:#fff;}
  .btn-danger:hover{background:var(--danger-dk);transform:translateY(-2px);}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none;}
  .mrow{display:flex;gap:10px;align-items:center;margin-bottom:16px;}
  .mrow .search{flex:1;}

  /* preview bar */
  .proto{background:#20302a;color:#e7efe9;font-size:.84rem;}
  [data-theme="dark"] .proto{background:#050d13;}
  .proto .wrap{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 24px;}
  .proto b{color:var(--sun);}
  .proto .spacer{flex:1;}
  .proto .pv{display:flex;gap:6px;flex-wrap:wrap;}
  .proto .pv button{background:transparent;border:1px solid #4a5d54;color:#cfe;border-radius:10px;padding:4px 11px;font-size:.8rem;cursor:pointer;font-family:inherit;}
  .proto .pv button.active{background:var(--sun);color:#20302a;border-color:var(--sun);font-weight:600;}
  .proto .pv-x{background:transparent;border:1px solid #4a5d54;color:#cfe;border-radius:10px;padding:4px 8px;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;margin-left:10px;transition:border-color .15s,color .15s;}
  .proto .pv-x:hover{border-color:#d0463b;color:#ffb3ab;}

  /* top nav — sized so all tabs fit on one row at the same height for everyone */
  .topbar{background:#F4D462;border-bottom:1px solid rgba(0,0,0,.14);position:sticky;top:0;z-index:50;transition:background .3s;}
  [data-theme="dark"] .topbar{background:#80471c;border-bottom:1px solid #5c3214;}
  [data-theme="dark"] .topbar .tabs button{color:#eadfce;}
  .topbar .brand{color:#0a4d0a;}
  .topbar .tabs button{color:#33261a;}
  [data-theme="dark"] .topbar .brand{color:var(--green);}
  .nav{display:flex;flex-wrap:nowrap;align-items:center;gap:11px;padding:6px 0;min-height:52px;}
  .brand{display:inline-flex;align-items:center;flex:none;text-decoration:none;}
  .brand-logo{height:clamp(30px,5vw,44px);width:clamp(30px,5vw,44px);object-fit:contain;display:block;}
  .tabs{flex:1 1 auto;min-width:0;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
  .tabsInner{display:flex;gap:2px;width:max-content;margin:0 auto;padding:0 4px;}
  .tabs::-webkit-scrollbar{display:none;}
  .tabs button{background:transparent;border:none;font-family:inherit;font-size:.92rem;font-weight:500;color:var(--ink);cursor:pointer;padding:7px 11px;border-radius:8px;border-bottom:2px solid transparent;white-space:nowrap;transition:color .2s;}
  .tabs button:hover{color:var(--green);}
  .tabs button.active{color:var(--green);border-bottom-color:var(--green);font-weight:600;}
  .tabs button.admin{color:var(--blue);}
  .tabs button.admin.active{color:var(--blue);border-bottom-color:var(--blue);}
  .acct{display:flex;gap:8px;align-items:center;white-space:nowrap;flex:none;}
  .iconbtn{background:var(--blue);border:1.5px solid var(--blue);color:#fff;width:38px;height:38px;border-radius:50%;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:background .2s,border-color .2s;}
  .iconbtn:hover{background:var(--blue-dk);border-color:var(--blue-dk);color:#fff;}
  .userbtn{display:inline-flex;align-items:center;gap:8px;background:transparent;border:1.5px solid var(--blue);border-radius:10px;padding:4px 12px 4px 4px;cursor:pointer;font-family:inherit;color:var(--ink);transition:background .2s;}
  .userbtn:hover{background:rgba(32,131,196,.12);}
  [data-theme="dark"] .userbtn:hover{background:rgba(92,179,234,.18);}
  .userbtn .uname{font-size:.9rem;font-weight:600;}
  .acct-profile{position:relative;display:inline-flex;}
  .acct-profile.out{display:none;}   /* logged-out "more" (three-dot) menu: only shown on narrow screens (see media query) */
  .nav-menu{position:absolute;top:calc(100% + 10px);right:0;min-width:188px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 34px rgba(20,48,42,.16);padding:6px;display:none;flex-direction:column;gap:2px;z-index:60;}
  [data-theme="dark"] .nav-menu{box-shadow:0 14px 34px rgba(0,0,0,.45);}
  .nav-menu.open{display:flex;}
  .nav-menu button{display:flex;align-items:center;gap:11px;background:none;border:none;padding:11px 13px;border-radius:9px;cursor:pointer;font-family:inherit;font-size:.92rem;font-weight:500;color:var(--ink);text-align:left;width:100%;transition:background .15s;}
  .nav-menu button:hover{background:var(--bg);}
  .nav-menu svg{width:18px;height:18px;flex-shrink:0;color:var(--muted);}
  .nav-menu button:hover svg{color:var(--green);}
  /* ---- mobile: hamburger + full-screen left slide-in "pages" sidebar (desktop keeps the horizontal tabs) ---- */
  .hamburger{display:none;flex-direction:column;justify-content:center;gap:4px;width:38px;height:38px;flex:none;background:none;border:none;cursor:pointer;padding:8px;border-radius:9px;}
  .hamburger span{display:block;height:2.5px;width:100%;background:#0a4d0a;border-radius:2px;transition:transform .22s ease,opacity .15s ease;}
  [data-theme="dark"] .hamburger span{background:#f0d9a8;}
  .hamburger:hover{background:rgba(0,0,0,.08);}
  [data-theme="dark"] .hamburger:hover{background:rgba(255,255,255,.12);}
  .hamburger.active span:nth-child(1){transform:translateY(6.5px) rotate(45deg);}   /* morph into an × while open */
  .hamburger.active span:nth-child(2){opacity:0;}
  .hamburger.active span:nth-child(3){transform:translateY(-6.5px) rotate(-45deg);}
  .sidebar{display:none;position:fixed;left:0;right:0;top:52px;bottom:0;background:var(--bg);z-index:45;transform:translateX(-100%);transition:transform .26s ease;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .sidebar.open{transform:translateX(0);box-shadow:6px 0 40px rgba(20,48,42,.18);}
  [dir="rtl"] .sidebar{transform:translateX(100%);}                                    /* RTL: the drawer lives on the right, where the menu button mirrors to */
  [dir="rtl"] .sidebar.open{transform:translateX(0);box-shadow:-6px 0 40px rgba(20,48,42,.18);}
  .sidebar-list{display:flex;flex-direction:column;padding:12px 14px 48px;gap:3px;}
  .side-item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:none;border-radius:13px;padding:16px 18px;font-family:"Gelasio",Georgia,serif;font-size:1.18rem;font-weight:600;color:var(--ink);cursor:pointer;transition:background .15s;}
  .side-item:hover,.side-item:focus-visible{background:var(--card);}
  .side-item.active{background:var(--mist);color:var(--forest);}
  [data-theme="dark"] .side-item.active{background:rgba(73,183,110,.16);color:var(--green);}
  .side-item.admin{color:var(--honey-deep);}
  body.sidebar-open{overflow:hidden;}
  @media(max-width:640px){
    .nav{min-height:44px;padding:5px 0;gap:9px;}
    .hamburger{display:flex;}
    .brand-logo{height:29px;width:29px;}
    .tabs{display:none;}                               /* pages move to the slide-in sidebar */
    .acct{gap:9px;margin-left:auto;}                   /* night-mode + language + profile: pushed right, spaced out */
    .iconbtn{width:34px;height:34px;}
    .nav .langnavbtn{height:34px;width:auto;max-width:118px;min-width:60px;flex-shrink:1;font-size:.82rem;padding:0 10px;}   /* higher specificity so mobile stays compact; only truncates its label on very narrow phones */
    .acct-profile.out{display:none;}                   /* theme + language are top-level now, so the logged-out "more" menu is gone */
    .acct.has-profile .userbtn .uname{display:none;}
    .acct.has-profile .userbtn{padding:3px;border-radius:50%;}
    .sidebar{display:block;}
    .nav-menu{min-width:174px;}
  }
  .avatar{width:30px;height:30px;border-radius:50%;object-fit:cover;display:inline-flex;align-items:center;justify-content:center;background:var(--green);color:#fff;font-weight:800;font-size:1.02rem;overflow:hidden;line-height:1;}
  .av-letter{color:#fff;font-family:"Gelasio",Georgia,'Times New Roman',serif;font-weight:800;line-height:1;}   /* the letter is always pure white \u2014 no tint can leak onto it */

  /* page bits */
  .view{padding-top:52px;padding-bottom:84px;}   /* vertical only — horizontal gutter comes from .wrap */
  .fade{animation:fade .5s cubic-bezier(.16,.8,.32,1);}
  @keyframes fade{from{opacity:0;transform:translateY(18px) scale(.992);}to{opacity:1;transform:none;}}
  .eyebrow{font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;font-weight:600;color:var(--blue);margin-bottom:8px;}
  .mis-head{font-size:1.7rem;letter-spacing:.01em;text-transform:none;font-weight:800;color:var(--green);font-family:"Gelasio",Georgia,serif;text-align:center;margin:2px 0 14px;}
  .mis-card{text-align:center;}
  .page-title{font-size:clamp(2rem,4.5vw,2.9rem);margin-bottom:10px;}
  .page-intro{font-size:1.1rem;color:var(--ink);max-width:65ch;margin-bottom:14px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:0 8px 22px rgba(20,48,42,.06);}
  [data-theme="dark"] .card{box-shadow:0 8px 22px rgba(0,0,0,.3);}
  .grid{display:grid;gap:20px;}
  .g3{grid-template-columns:repeat(3,1fr);}
  .g4{grid-template-columns:repeat(4,1fr);}
  .g2{grid-template-columns:repeat(2,1fr);}
  .muted{color:var(--muted);}
  .pill{display:inline-block;background:rgba(32,131,196,.12);color:var(--blue-dk);border-radius:100px;padding:3px 12px;font-size:.76rem;font-weight:600;}
  [data-theme="dark"] .pill{background:rgba(92,179,234,.18);color:var(--blue);}
  .addbtn{background:transparent;border:2px dashed var(--line);color:var(--muted);border-radius:12px;padding:12px 18px;cursor:pointer;font-family:inherit;font-weight:600;font-size:.9rem;width:100%;transition:border-color .2s,color .2s;}
  .addbtn:hover{border-color:var(--green);color:var(--green);}
  .rowbtns{display:flex;gap:6px;margin-top:10px;}
  .sec{margin-bottom:52px;}
  .home-stack{display:flex;flex-direction:column;gap:46px;padding:46px 0 54px;}
  .sechead{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:16px;}

  /* info tooltip (ⓘ) — upright, and opens BELOW so it never gets clipped by the nav */
  .info{position:relative;display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--blue);color:#fff;font-size:.72rem;font-weight:700;cursor:help;margin-left:6px;font-style:normal;vertical-align:middle;}
  .info .tip{visibility:hidden;opacity:0;position:absolute;top:150%;left:50%;transform:translateX(-50%);background:#20302a;color:#eef;padding:10px 12px;border-radius:8px;font-size:.82rem;font-weight:400;white-space:normal;width:240px;line-height:1.4;z-index:60;transition:opacity .15s;box-shadow:0 8px 24px rgba(0,0,0,.25);}
  .info .tip::after{content:"";position:absolute;bottom:100%;left:50%;transform:translateX(-50%);border:6px solid transparent;border-bottom-color:#20302a;}
  .info .tip a{color:var(--sun);}
  .info:hover .tip,.info:focus .tip,.info:focus-within .tip{visibility:visible;opacity:1;}

  /* ---------- HERO (home) ---------- */
  .hero-scroll{position:relative;height:var(--seasons,240vh);}
  .hero{position:sticky;top:var(--nav-h, 64px);height:calc(100vh - var(--nav-h, 64px));overflow:hidden;isolation:isolate;}
  .sky{position:absolute;inset:0;z-index:0;transition:none;}
  .stars,.milky{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:0;transition:opacity .4s;}
  .constellations{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;opacity:0;transition:opacity .4s;}
  .hero.night .stars,.hero.night .milky,.hero.night .constellations{opacity:1;}
  .milky{background:
      radial-gradient(40% 26% at 58% 32%, rgba(255,244,222,.09), transparent 72%),
      radial-gradient(26% 20% at 50% 46%, rgba(150,110,70,.15), transparent 72%),
      radial-gradient(24% 18% at 64% 24%, rgba(170,120,72,.14), transparent 74%),
      radial-gradient(20% 15% at 54% 40%, rgba(224,180,120,.14), transparent 72%),
      radial-gradient(18% 14% at 68% 18%, rgba(234,194,132,.13), transparent 74%),
      radial-gradient(26% 22% at 47% 50%, rgba(88,120,220,.13), transparent 74%),
      radial-gradient(22% 18% at 66% 22%, rgba(120,90,210,.12), transparent 74%),
      radial-gradient(20% 16% at 60% 30%, rgba(70,100,200,.10), transparent 76%),
      radial-gradient(16% 14% at 52% 44%, rgba(140,82,190,.10), transparent 76%);
    filter:blur(8px);mix-blend-mode:screen;}
  .milky::after{content:"";position:absolute;inset:0;opacity:.55;background:
      radial-gradient(1.3px 1.3px at 55% 33%,#fff,transparent),radial-gradient(1px 1px at 60% 26%,#d5ddff,transparent),
      radial-gradient(1.3px 1.3px at 64% 24%,#fff,transparent),radial-gradient(1px 1px at 58% 34%,#e9edff,transparent),
      radial-gradient(1px 1px at 52% 40%,#cfd8ff,transparent),radial-gradient(1.3px 1.3px at 49% 48%,#fff,transparent),
      radial-gradient(1px 1px at 46% 52%,#ffe9cf,transparent),radial-gradient(1.2px 1.2px at 57% 30%,#fff5e6,transparent),
      radial-gradient(1px 1px at 61% 22%,#ffe9cf,transparent),radial-gradient(1.1px 1.1px at 66% 20%,#fff,transparent),
      radial-gradient(1px 1px at 50% 44%,#ffe0c0,transparent),radial-gradient(1.2px 1.2px at 70% 16%,#fff,transparent),
      radial-gradient(1px 1px at 48% 46%,#f0e6ff,transparent),radial-gradient(1.1px 1.1px at 63% 28%,#fff,transparent),
      radial-gradient(1px 1px at 54% 38%,#ffedd6,transparent),radial-gradient(1.2px 1.2px at 72% 14%,#fff,transparent);}
  .star{position:absolute;border-radius:50%;background:#fff;}
  .star.tw{box-shadow:0 0 4px 1px rgba(255,255,255,.9);}
  .cline{fill:none;stroke:#b6cbff;stroke-width:1.4;opacity:0;filter:drop-shadow(0 0 3px rgba(150,185,255,.8)) drop-shadow(0 0 7px rgba(120,160,255,.45));}
  .cstar{fill:#ffffff;opacity:.4;filter:drop-shadow(0 0 3px rgba(200,220,255,.8));}
  .celestial{position:absolute;inset:0;z-index:1;pointer-events:none;}
  .sun-wrap{position:absolute;left:0;top:0;width:150px;height:150px;will-change:transform;}
  .sun-glow{position:absolute;left:50%;top:50%;width:340px;height:340px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(244,212,98,.72),rgba(244,212,98,0) 70%);mix-blend-mode:screen;}
  .sun-disk{position:absolute;left:50%;top:50%;width:120px;height:120px;transform:translate(-50%,-50%);border-radius:50%;background:var(--sun);box-shadow:0 0 46px rgba(244,212,98,.6);}
  .moon{position:absolute;left:50%;top:8%;transform:translateX(-50%) scale(var(--hs,1));transform-origin:top center;filter:drop-shadow(0 0 18px rgba(200,215,255,.4));}
  .clouds{position:absolute;inset:0;z-index:2;pointer-events:none;}
  .cloud{position:absolute;fill:#ffffff;opacity:.9;}
  .hills-back{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:34vh;z-index:2;display:block;}
  .hills-front{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:23vh;z-index:5;display:block;}
  .ground-shadows{position:absolute;left:0;right:0;bottom:0;width:100%;height:52vh;z-index:2;pointer-events:none;}
  .tshadow{position:absolute;left:0;top:0;width:120px;height:24px;border-radius:50%;background:radial-gradient(closest-side,rgba(8,38,14,.5),rgba(8,38,14,0));z-index:6;pointer-events:none;opacity:0;transform-origin:center;will-change:transform,opacity;}
  .leaf-pile{position:absolute;inset:0;width:100%;height:100%;z-index:6;pointer-events:none;opacity:0;overflow:visible;}
  .tree{position:absolute;bottom:0;width:190px;height:44vh;z-index:3;transform-origin:50% 62.3%;pointer-events:none;}
  .tree-left{left:-6px;}
  .tree-right{right:-6px;transform:scaleX(-1);}
  .trunk{fill:#7a5636;transition:fill .3s;}
  [data-theme="dark"] .hero .trunk{fill:#41301f;}
  .bark{fill:none;stroke:#7a5636;stroke-linecap:round;stroke-linejoin:round;transition:stroke .3s;}
  [data-theme="dark"] .hero .bark{stroke:#41301f;}
  .foliage{transform-origin:100px 118px;animation:rustle 5s ease-in-out infinite;}
  .foliage.still{animation:none;}
  .leaf{fill:var(--leaf,#3f8f4f);transition:fill .12s;}
  @keyframes rustle{0%,100%{transform:rotate(-1deg);}50%{transform:rotate(1deg);}}
  .flower .bud{fill:#a9c98d;}
  .flower .petals{fill:#ffc0d8;}
  .flower .fcenter{fill:#ffdd66;}
  .flyleaf{position:absolute;width:calc(16px*var(--hs,1));height:calc(16px*var(--hs,1));z-index:12;pointer-events:none;overflow:visible;}
  .zzz{position:absolute;left:0;top:0;z-index:6;pointer-events:none;}
  .zzz span{position:absolute;font-family:"Gelasio",serif;font-weight:700;color:#eef4ff;text-shadow:0 1px 6px rgba(0,0,0,.4);will-change:transform,opacity;}
  .scroll-hint{margin-top:20px;font-size:.8rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);opacity:.8;animation:hintbob 1.8s ease-in-out infinite;}
  [data-theme="dark"] .hero-content .scroll-hint{color:#bcc7d6;}
  @keyframes hintbob{0%,100%{transform:translateY(0);opacity:.5;}50%{transform:translateY(5px);opacity:.9;}}
  .hero-content{position:relative;z-index:7;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:calc(48px + 11vh) 24px 190px;}   /* 2.8: the words and their clouds sit lower in the sky */
  .wordmark{font-size:clamp(2.2rem,7.6vw,5rem);font-weight:900;letter-spacing:-.03em;color:var(--green);margin:34px 0 34px;padding-bottom:.37em;position:relative;z-index:0;}
  .wordmark .cw{position:relative;display:inline-block;}
  .wordmark .cwsvg{position:absolute;left:50%;top:50%;width:132%;height:152%;transform:translate(-50%,-58%);z-index:-1;pointer-events:none;overflow:visible;}   /* 2.8: a bit smaller so each word keeps its own cloud, instead of the Earth's cloud hiding behind Sweet's */
  .wordmark .cw:nth-of-type(2){animation-delay:-1.8s;}
  .wordmark .cw:nth-of-type(3){animation-delay:-3.5s;}
  @keyframes cwFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-7px);}}
  @keyframes cwDrift{0%,100%{transform:translate(-50%,-58%) scale(1);}50%{transform:translate(-50%,-63%) scale(1.05);}}   /* the clouds behind the words billow softly */
  [data-theme="dark"] .wordmark .cwsvg{display:none;}

  [data-theme="dark"] .hero-content .wordmark{color:#fff;text-shadow:0 2px 18px rgba(0,0,0,.5);}
  .wordmark .sw{color:var(--blue);font-style:italic;font-weight:600;}
  [data-theme="dark"] .hero-content .wordmark .sw{color:var(--sun);}
  .tagline{font-family:"Gelasio",Georgia,serif;font-style:italic;font-size:clamp(1.55rem,3.5vw,2.4rem);line-height:1.55;color:var(--ink);max-width:640px;margin:0 auto 34px;}
  [data-theme="dark"] .hero-content .tagline{color:#e7eef3;text-shadow:0 1px 12px rgba(0,0,0,.55);}  /* light text with a soft shadow so it reads over the night sky */
  .cta-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:6px;}
  .hero-chips{gap:10px;}
  .cta-eq{min-width:210px;text-align:center;}   /* the two hero buttons match in size */
  .shooting{position:absolute;height:2px;width:120px;background:linear-gradient(90deg,rgba(255,255,255,0),#fff);border-radius:2px;z-index:1;pointer-events:none;}
  /* birds: small silhouettes gliding across the top two-thirds (daytime only) */
  .birds{position:absolute;z-index:4;pointer-events:none;}
  .bird{position:absolute;color:#333;}
  [data-theme="dark"] .hero .bird{color:#9aa6b4;}
  .bird svg{display:block;fill:currentColor;}
  /* winter snow: falling flakes; the ground shapes themselves recolour to white */
  .snow{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0;}
  .snow span{position:absolute;top:-6%;border-radius:50%;background:#fff;opacity:.9;animation:snowfall linear infinite;}
  @keyframes snowfall{0%{transform:translate(0,-10%);}100%{transform:translate(var(--dx,10px),120vh);}}
  .windgust{position:absolute;z-index:12;pointer-events:none;overflow:visible;}
  .windgust path{fill:none;stroke:#ffffff;stroke-linecap:round;}

  /* team */
  .team-photo{width:96px;height:96px;border-radius:50%;margin:0 auto 14px;object-fit:cover;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.8rem;font-weight:700;overflow:hidden;}
  .team-card{text-align:center;}
  .team-card h3{font-size:1.15rem;margin-bottom:4px;}

  /* discord */
  .discord{text-align:center;}
  .discord h2{font-size:1.7rem;margin-bottom:8px;}

  /* newsletter */
  .featured{border-left:5px solid var(--green);}
  .reactions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
  .reactions button{background:transparent;border:1px solid var(--line);border-radius:100px;padding:6px 13px;font-size:.88rem;cursor:pointer;font-family:inherit;color:var(--ink);transition:background .15s,border-color .15s;}
  .reactions button:hover{border-color:var(--green);}
  .reactions button.on{background:var(--green);color:#fff;border-color:var(--green);}
  .postcard{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:10px;}
  .postcard .t{cursor:pointer;font-weight:600;}
  .composer input,.composer textarea,.ed input,.ed textarea,.ed select{width:100%;font-family:inherit;font-size:1rem;padding:11px 13px;border:1px solid var(--line);border-radius:10px;margin-bottom:12px;background:var(--card);color:var(--ink);}
  .tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}

  /* chapters */
  .search{width:100%;font-family:inherit;font-size:1rem;padding:13px 16px;border:1px solid var(--line);border-radius:12px;margin-bottom:20px;background:var(--card);color:var(--ink);}
  details.cont{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden;}
  details.cont summary{cursor:pointer;padding:15px 18px;font-weight:600;color:var(--green);list-style:none;display:flex;justify-content:space-between;}
  details.cont summary::-webkit-details-marker{display:none;}
  details.cont summary::after{content:"+";color:var(--blue);}
  details.cont[open] summary::after{content:"\2013";}
  details.cont .body{padding:0 18px 16px;}
  .chp-country{padding:8px 0;border-top:1px solid var(--line);}
  .chp-country:first-child{border-top:none;}
  .chp-cn{font-weight:600;margin-bottom:4px;}
  .chp-list{list-style:none;margin:0;padding:0 0 0 4px;}
  .chp-list li{padding:3px 0;color:var(--ink);}
  .chaphead{color:var(--green);font-size:1.5rem;margin:30px 0 14px;}
  /* membership "what we plan to do" list */
  .mem-list{list-style:none;margin:0;padding:0;}
  .mem-item{margin:0 0 32px;}
  .mem-h{color:var(--green);font-size:1.35rem;margin:0 0 10px;}
  .mem-p{margin:0;line-height:1.8;color:var(--ink);}   /* normal body text size (same as other pages) */
  .mem-p a,.mem-close a{color:var(--blue);font-weight:600;text-decoration:underline;}
  .mem-close{margin:36px 0 0;line-height:1.8;font-weight:600;}
  .chapreqs{margin:0 0 8px;padding-left:20px;line-height:1.7;}
  .chapreqs li{margin-bottom:9px;color:var(--ink);padding-left:4px;}
  .chapreqs li::marker{color:var(--green);}
  .chapreqs a{color:var(--blue);font-weight:600;}
  /* chapter application form */
  .apply-card{max-width:100%;}
  .ca-fld{margin-bottom:20px;}
  .ca-label{display:block;font-weight:600;color:var(--ink);margin-bottom:7px;font-size:.98rem;}
  .ca-label .muted{font-weight:400;}
  .apply .in{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-family:inherit;font-size:.95rem;box-sizing:border-box;}
  .apply textarea.in{resize:vertical;line-height:1.5;}
  .apply select.in{cursor:pointer;}
  .ca-five{display:grid;gap:8px;}
  .ca-hint{margin:6px 0 0;font-size:.82rem;color:var(--muted);}
  .ca-hint.bad{color:#c0392b;}
  .ca-hint.ok{color:var(--green);}
  .ca-check{display:flex;gap:10px;align-items:flex-start;margin:6px 0 20px;font-size:.92rem;line-height:1.45;cursor:pointer;}
  .ca-check input{margin-top:3px;flex:none;width:17px;height:17px;}
  .consent-img{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:10px;background:#fbfaf5;margin-bottom:10px;-webkit-user-select:none;user-select:none;pointer-events:none;}
  [data-theme="dark"] .consent-img{background:#20241d;}
  .sig-wrap{display:flex;flex-direction:column;gap:6px;align-items:flex-start;}
  .sigpad{width:100%;max-width:420px;height:150px;border:1px dashed var(--line);border-radius:10px;background:#fbfaf5;touch-action:none;cursor:crosshair;}
  [data-theme="dark"] .sigpad{background:#20241d;}
  .ca-recap{border:1px solid var(--line);border-radius:10px;padding:14px;display:inline-flex;align-items:center;gap:12px;background:var(--card);}
  .ca-recap input{width:26px;height:26px;flex:none;cursor:pointer;}
  .ca-note{font-size:.82rem;color:var(--muted);margin:6px 0 0;}
  /* homemade "slide the puzzle piece" captcha — no third-party service, drawn on a canvas */
  .pcap{margin-top:2px;max-width:420px;}
  .pcap-stage{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#0b131a;line-height:0;}
  .pcap-canvas{width:100%;height:auto;display:block;-webkit-user-select:none;user-select:none;}
  .pcap-refresh{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:8px;border:none;background:rgba(255,255,255,.9);color:#2a3b32;cursor:pointer;font-size:16px;line-height:30px;text-align:center;padding:0;}
  .pcap-refresh:hover{background:#fff;}
  .pcap-done{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,118,0,.6);color:#fff;font-weight:700;font-size:1.05rem;}
  .pcap.solved .pcap-done{display:flex;}
  .pcap-slider{width:100%;margin:12px 0 4px;-webkit-appearance:none;appearance:none;height:16px;border-radius:9px;background:var(--bg);border:1px solid var(--line);outline:none;cursor:grab;}
  .pcap-slider:focus-visible{box-shadow:0 0 0 3px rgba(32,131,196,.45);}
  .pcap-slider:active{cursor:grabbing;}
  .pcap-slider:disabled{opacity:.75;cursor:default;}
  .pcap-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:44px;height:28px;border-radius:7px;background:var(--sun);border:1.5px solid #c79a12;box-shadow:0 2px 6px rgba(0,0,0,.28);cursor:grab;}
  .pcap-slider::-moz-range-thumb{width:44px;height:28px;border-radius:7px;background:var(--sun);border:1.5px solid #c79a12;box-shadow:0 2px 6px rgba(0,0,0,.28);cursor:grab;}
  .pcap.solved .pcap-slider{background:var(--green);border-color:var(--green-dk);}
  .pcap-label{font-size:.82rem;color:var(--muted);margin:2px 0 0;}
  .pcap.solved .pcap-label{color:var(--green);font-weight:600;}
  .ed-select{width:100%;font-family:inherit;font-size:1rem;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);}

  /* calendar */
  .mtg-rect{display:block;background:var(--card);border:2px solid var(--green);border-radius:14px;padding:22px;text-align:center;font-weight:600;color:var(--green);text-decoration:none;margin-bottom:20px;}
  .mtg-rect:hover{background:rgba(0,118,0,.06);}
  .evt{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px 18px;margin-bottom:12px;cursor:pointer;}
  .evt:hover{border-color:var(--blue);}
  .evt .en{font-weight:600;color:var(--green);}
  .evt .ed2{font-size:.88rem;color:var(--muted);}

  /* gallery */
  .gitem{border-radius:12px;overflow:hidden;background:var(--card);border:1px solid var(--line);}
  .gitem img{width:100%;aspect-ratio:4/3;object-fit:cover;}
  .gitem figcaption{padding:10px 12px;font-size:.9rem;color:var(--muted);}

  /* admin table */
  .tbl{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;}
  .tbl th,.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;font-size:.9rem;vertical-align:middle;}
  .tbl th{background:rgba(0,118,0,.06);color:var(--green);font-family:"Gelasio",serif;}
  [data-theme="dark"] .tbl th{background:rgba(73,183,110,.12);}
  .tbl tr:last-child td{border-bottom:none;}
  .tbl td.c,.tbl th.c{text-align:center;}
  .switch{position:relative;display:inline-block;width:40px;height:22px;}
  .switch input{opacity:0;width:0;height:0;}
  .slider{position:absolute;inset:0;background:var(--line);border-radius:22px;transition:.2s;cursor:pointer;}
  .slider::before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;}
  .switch input:checked + .slider{background:var(--green);}
  .switch input:checked + .slider::before{transform:translateX(18px);}
  .switch input:disabled + .slider{opacity:.5;cursor:not-allowed;}
  select.rsel{font-family:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);}

  .denied{text-align:center;max-width:520px;margin:40px auto;padding:0;overflow:hidden;}
  .denied .denied-body{padding:22px 26px 30px;}
  .denied .denied-body h2{margin-bottom:8px;}
  .denied-scene{display:block;width:100%;border-bottom:1px solid var(--line);}
  .dn-tree{animation:dnSway 5s ease-in-out infinite;}
  .dn-tree2{animation-duration:6.3s;}
  @keyframes dnSway{0%,100%{transform:rotate(-1.4deg);}50%{transform:rotate(1.6deg);}}
  .dn-float{animation:dnFloat 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center;}
  @keyframes dnFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-7px);}}
  .dn-leaf{animation:dnLeaf 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center;}
  @keyframes dnLeaf{0%,100%{transform:translateY(0) rotate(0deg);}50%{transform:translateY(-8px) rotate(14deg);}}
  [data-theme="dark"] .denied-scene{filter:saturate(.7) brightness(.75);}
  .denied .big{font-size:2.4rem;margin-bottom:10px;}

  /* social links list */
  .links{display:flex;flex-wrap:wrap;gap:10px;}
  .links a,.links .lk{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 16px;text-decoration:none;color:var(--blue);font-weight:600;font-size:.9rem;}
  .links a:hover{border-color:var(--blue);}

  /* modal / toast */
  .modal{position:fixed;inset:0;background:rgba(20,48,42,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:300;}
  .modal.open{display:flex;}
  .modal-card{background:var(--card);color:var(--ink);border-radius:18px;padding:28px;max-width:460px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35);max-height:88vh;overflow:auto;animation:pop .2s ease;}
  @keyframes pop{from{transform:scale(.95);opacity:0;}to{transform:none;opacity:1;}}
  .modal-card h3{font-size:1.4rem;margin-bottom:10px;}
  .modal-card .x{float:right;background:none;border:none;font-size:1.4rem;cursor:pointer;color:var(--muted);line-height:1;}
  [dir="rtl"] .modal-card .x{float:left;}   /* close button mirrors to the top-left in right-to-left languages */
  .modal-card label{display:block;font-size:.84rem;font-weight:600;color:var(--green);margin:15px 0 9px;}
  .modal-card input,.modal-card textarea,.modal-card select{width:100%;font-family:inherit;font-size:1rem;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);}
  .modal-note{background:rgba(32,131,196,.1);border:1px solid rgba(32,131,196,.3);color:var(--blue-dk);border-radius:10px;padding:11px 13px;font-size:.83rem;margin:12px 0;}
  [data-theme="dark"] .modal-note{color:var(--blue);}
  .err{color:#d0463b;font-size:.83rem;margin:6px 0 0;min-height:1em;}
  .img-prev img{width:80px;height:80px;object-fit:cover;border-radius:10px;margin-top:8px;border:1px solid var(--line);}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:#20302a;color:#eef;padding:12px 20px;border-radius:100px;font-size:.9rem;opacity:0;transition:.3s;z-index:400;pointer-events:none;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* footer */
  footer{background:#F4D462;color:#3a2f14;padding:44px 0 34px;text-align:center;font-size:.9rem;}
  [data-theme="dark"] footer{background:#80471c;color:#f3e7d8;border-top:1px solid #5c3214;}
  footer .fm{font-family:"Gelasio",serif;font-size:1.3rem;margin-bottom:14px;color:var(--green);}
  footer .fm .sw{color:var(--blue);font-style:italic;}
  footer .fcol{margin:14px 0;}
  footer .flab{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;opacity:.7;margin-bottom:8px;}
  footer .links{justify-content:center;}
  footer .links a,footer .links .lk{background:rgba(0,0,0,.06);border-color:rgba(0,0,0,.2);color:var(--blue-dk);}
  [data-theme="dark"] footer .links a,[data-theme="dark"] footer .links .lk{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.25);color:var(--blue);}
  footer .addbtn{max-width:280px;margin:0 auto;color:#3a2f14;border-color:rgba(0,0,0,.35);}
  [data-theme="dark"] footer .addbtn{color:#e8dcc0;border-color:rgba(255,255,255,.4);}
  footer .cpy{margin-top:20px;color:#000;}
  [data-theme="dark"] footer .cpy{color:#fff;}

  @media (max-width:900px){.g4{grid-template-columns:repeat(2,1fr);}.g3{grid-template-columns:1fr;}.g2{grid-template-columns:1fr;}}
  @media (max-width:640px){.view{padding-top:38px;padding-bottom:60px;}}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto;}*{transition:none!important;}.foliage,.star,.snow span,.wordmark .cw,.wordmark .cwsvg{animation:none!important;}}
  /* activities */
  .acts-sub{font-family:"Gelasio",serif;font-size:1.5rem;color:var(--green);margin:34px 0 14px;}
  .cat-grid,.act-list{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  .acard{border-radius:18px;padding:22px;display:flex;flex-direction:column;box-shadow:0 8px 22px rgba(20,48,42,.10);}
  [data-theme="dark"] .acard{box-shadow:0 8px 22px rgba(0,0,0,.32);}
  .acard-color{color:#fff;}
  .acard-plain{background:var(--card);border:1px solid var(--line);color:var(--ink);}
  .acard-plain .acard-name{color:var(--green);}
  .acard-name{font-family:"Gelasio",serif;font-size:1.45rem;font-weight:600;margin-bottom:12px;line-height:1.15;}
  .acard-img{width:100%;height:148px;border-radius:12px;margin-bottom:14px;object-fit:cover;background:rgba(255,255,255,.16);}
  .acard-plain .acard-img{background:rgba(0,118,0,.07);}
  .acard-noimg{display:flex;align-items:center;justify-content:center;font-size:2.6rem;}
  .acard-desc{font-size:.97rem;line-height:1.55;margin-bottom:16px;flex:1;}
  .acard-desc.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
  .acard-btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .acard-btn{align-self:flex-start;background:rgba(255,255,255,.92);color:#1d5c34;border:1px solid rgba(0,0,0,.06);font-size:.78rem;font-weight:700;letter-spacing:.02em;padding:7px 13px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
  .acard-btn::after{content:"\2192";margin-left:6px;display:inline-block;transition:transform .22s cubic-bezier(.34,1.56,.64,1);}
  .acard-btn.open::after{transform:rotate(90deg);}
  .acard-btn:hover{background:#fff;transform:translateY(-2px);}
  .acard-plain .acard-btn{background:rgba(0,118,0,.08);color:var(--green);border-color:rgba(0,118,0,.16);}
  .acard-plain .acard-btn:hover{background:rgba(0,118,0,.14);}
  [data-theme="dark"] .acard-btn{background:rgba(16,27,36,.85);color:#a9e2bd;border-color:rgba(255,255,255,.12);}

  .featured-act{display:grid;grid-template-columns:minmax(0,340px) 1fr;gap:24px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--green);border-radius:18px;padding:22px;box-shadow:0 8px 22px rgba(20,48,42,.08);}

  .nl-feat-t{font-size:1.75rem;color:var(--green);margin:10px 0 4px;}
  .nl-feat-b{white-space:pre-wrap;font-size:1.03rem;line-height:1.7;margin-bottom:14px;}
  .nl-sub{font-family:"Gelasio",serif;font-size:1.15rem;color:var(--green);margin:26px 0 12px;}
  .nl-arch{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:18px;}

  /* ===================== NEWSLETTER POSTCARDS ===================== */
  .postcard{position:relative;display:flex;flex-wrap:wrap;gap:0 16px;align-items:flex-start;padding:20px 18px 14px;border-radius:6px;
    background:#fdf9ef;background-image:repeating-linear-gradient(0deg,transparent,transparent 25px,rgba(20,90,60,.08) 25px,rgba(20,90,60,.08) 26px);
    border:1px solid #e6dcc3;box-shadow:0 8px 20px rgba(90,70,20,.13);transition:transform .25s cubic-bezier(.16,.8,.32,1),box-shadow .25s;}
  .postcard:hover{transform:rotate(-.5deg) translateY(-4px);box-shadow:0 16px 34px rgba(90,70,20,.2);}
  .postcard::after{content:"";position:absolute;left:52%;top:12px;bottom:44px;width:0;border-left:1px dashed rgba(20,90,60,.35);}   /* the classic centre line */
  .pc-msg{flex:1 1 46%;min-width:150px;padding-right:4px;}
  .pc-brand{font-size:.62rem;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:#a2802a;}
  .pc-title{font-family:"Gelasio",Georgia,serif;font-weight:700;font-size:1.12rem;line-height:1.28;color:#1e3d29;margin-top:6px;overflow-wrap:break-word;}
  .pc-time{font-size:.75rem;color:#8a7b52;margin-top:6px;}
  .pc-side{flex:1 1 40%;min-width:160px;}
  .pc-stampwrap{position:relative;height:92px;margin-bottom:8px;}
  .pc-stamp{position:absolute;right:0;top:0;width:72px;height:88px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    color:#fff;background:linear-gradient(160deg,#37a75e,#146639);font-size:.55rem;letter-spacing:.14em;font-weight:700;
    border:2px dashed rgba(255,255,255,.9);border-radius:3px;box-shadow:0 3px 10px rgba(20,60,30,.28);}   /* perforated stamp edge: white dashed border, fully visible on any background */
  [data-theme="dark"] .pc-stamp{border-color:rgba(255,255,255,.85);}
  .pc-stamp svg{width:26px;height:26px;}
  .pc-postmark{position:absolute;left:-8px;top:6px;width:78px;height:78px;border:2px solid rgba(60,45,15,.5);border-radius:50%;transform:rotate(-11deg);   /* 2.8: sits beside the stamp now, not on top of it */
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:rgba(60,45,15,.6);text-align:center;mix-blend-mode:multiply;}
  .pc-postmark .pmw{font-size:.5rem;font-weight:700;letter-spacing:.13em;text-decoration:underline wavy;text-transform:uppercase;}
  .pc-postmark .pmd{font-size:.64rem;font-weight:700;letter-spacing:.06em;}
  .pc-addr{color:#7c6a42;font-size:.8rem;line-height:1.7;font-style:italic;}
  .postcard .nl-a-b{flex-basis:100%;margin-top:6px;}
  [data-theme="dark"] .postcard{background:#20291f;background-image:repeating-linear-gradient(0deg,transparent,transparent 25px,rgba(255,255,255,.055) 25px,rgba(255,255,255,.055) 26px);border-color:#37452f;box-shadow:0 8px 20px rgba(0,0,0,.35);}
  [data-theme="dark"] .pc-title{color:#e9f2e6;}
  [data-theme="dark"] .pc-brand{color:#cbb469;}
  [data-theme="dark"] .pc-time,[data-theme="dark"] .pc-addr{color:#a89f84;}
  [data-theme="dark"] .pc-postmark{border-color:rgba(220,210,170,.4);color:rgba(220,210,170,.5);}
  .pc-corner{position:absolute;top:14px;right:16px;pointer-events:none;transform:scale(.82);transform-origin:top right;}
  .nl-a{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;flex-wrap:wrap;}
  .nl-a-m{display:flex;flex-direction:column;gap:2px;min-width:0;}
  .nl-a-t{font-family:"Gelasio",serif;font-weight:600;color:var(--ink);}
  .nl-a-b{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  .nl-btns{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0 20px;}
  .nl-btns .btn{flex:1 1 auto;min-width:210px;text-align:center;justify-content:center;}
  .nl-intro{margin:0 0 26px;}
  .nl-intro p{margin:0 0 12px;line-height:1.65;color:var(--ink);}
  .nl-intro p:last-child{margin-bottom:0;}
  /* challenges / speakers / participate / event sign-ups */
  .ch-list{margin:0 0 6px;padding-left:22px;}
  .ch-list li{margin-bottom:9px;line-height:1.55;}
  .mgs-note{display:flex;gap:14px;align-items:flex-start;background:rgba(32,131,196,.09);border:1px solid rgba(32,131,196,.3);border-radius:14px;padding:16px 18px;margin:22px 0 6px;}
  .mgs-emoji{font-size:1.8rem;line-height:1;}
  .participate{margin-top:40px;padding-top:26px;border-top:1px solid var(--line);}
  .participate h2{font-family:"Gelasio",serif;color:var(--green);}
  .cev-side{display:flex;align-items:center;gap:8px;padding-right:12px;flex-wrap:wrap;}
  .cev-going{font-size:.82rem;color:var(--muted);white-space:nowrap;}
  .cev.next{box-shadow:0 0 0 2px rgba(0,118,0,.25);}
  .cev.next .cev-name::after{content:"Next up";margin-left:8px;font-size:.7rem;font-weight:600;color:#fff;background:var(--green);border-radius:100px;padding:2px 8px;vertical-align:middle;}
  /* chapter hub / chapter calendar */
  .chapter-cal{margin-top:36px;padding-top:26px;border-top:1px solid var(--line);}
  .dc-status{padding:9px 12px;border:1px solid var(--line);border-radius:10px;font-size:.9rem;background:var(--card);}
  /* contact / about stat / gallery submit spacing */
  .contact-q{font-size:1.35rem;color:var(--ink);margin-bottom:6px;}
  .contact-line{font-size:1.15rem;color:var(--ink);}
  .about-stat{font-size:1.5rem;color:var(--muted);margin:-4px 0 26px;}
  .g-submit-far{margin-top:22vh;}
  /* ===== language intro splash ===== */
  .li-hidden{display:none!important;}
  .lang-intro{position:fixed;inset:0;z-index:9000;background:#0F7A24;overflow:hidden;display:flex;align-items:center;justify-content:center;transition:background-color .85s ease;}
  .li-close{position:fixed;top:20px;right:26px;width:44px;height:44px;border:none;background:rgba(255,255,255,.16);color:#fff;font-size:1.7rem;line-height:1;border-radius:50%;cursor:pointer;z-index:5;transition:background .18s ease;}
  .li-close:hover{background:rgba(255,255,255,.3);}
  /* modeled on the profile button (.userbtn): transparent pill, blue border, ~38px, same hover -- but keeps a blue world icon */
  .langnavbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;min-width:120px;max-width:150px;box-sizing:border-box;padding:0 14px;border:1.5px solid var(--blue);background:transparent;border-radius:10px;cursor:pointer;font-family:inherit;color:var(--ink);font-size:.9rem;font-weight:600;transition:background .2s;}
  .langnavbtn:hover{background:rgba(32,131,196,.12);}
  .langnavbtn .globe{width:16px;height:16px;flex-shrink:0;color:var(--blue);opacity:1;}
  .langnavbtn #navLangText{transition:opacity .3s ease;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  [data-theme="dark"] .langnavbtn{background:transparent;border-color:var(--blue);color:var(--ink);}
  [data-theme="dark"] .langnavbtn:hover{background:rgba(92,179,234,.18);}
  .lang-intro.revealing{background-color:rgba(15,122,36,0);}
  .li-bg{position:absolute;inset:0;overflow:hidden;transition:opacity .85s ease;}
  .lang-intro.revealing .li-bg{opacity:0;}
  .li-letter{position:absolute;top:0;left:0;color:#fff;font-family:"Gelasio",Georgia,serif;font-weight:600;pointer-events:none;user-select:none;will-change:transform,opacity;line-height:1;}
  .li-stage{position:relative;z-index:2;width:100%;display:flex;align-items:center;justify-content:center;padding:24px;}
  .li-cycle{background:rgba(255,255,255,.14);border:2px solid #fff;color:#fff;font-family:"Gelasio",Georgia,serif;font-weight:600;font-size:clamp(1.7rem,5vw,3rem);padding:.42em 1.3em;border-radius:100px;cursor:pointer;width:min(90vw,560px);min-height:1.9em;box-shadow:0 12px 44px rgba(0,0,0,.28);transition:background .2s ease,transform .2s ease;display:inline-flex;align-items:center;justify-content:center;}
  .li-cycle:hover{background:rgba(255,255,255,.26);transform:translateY(-2px);}
  .li-cycle:active{transform:translateY(0);}
  #liCycleText{display:inline-block;transition:opacity .3s ease;}
  .li-list-wrap{text-align:center;width:100%;}
  .li-search-wrap{position:relative;width:min(90vw,560px);margin:0 auto 18px;}
  .li-search-ic{position:absolute;left:20px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:#fff;opacity:.8;pointer-events:none;}
  .li-search{width:100%;box-sizing:border-box;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.6);color:#fff;font-family:inherit;font-size:1.25rem;text-align:center;padding:14px 46px;border-radius:100px;outline:none;transition:border-color .18s ease,background .18s ease;}
  .li-search::placeholder{color:rgba(255,255,255,.55);}
  .li-search:focus{border-color:#fff;background:rgba(255,255,255,.22);}
  .li-noresult{color:rgba(255,255,255,.7);text-align:center;padding:22px;font-size:1.1rem;}
  .li-globe{font-size:2.4rem;color:rgba(255,255,255,.9);margin-bottom:18px;}
  .li-list{display:grid;grid-template-columns:repeat(auto-fill,182px);justify-content:center;gap:12px;max-width:min(96vw,960px);max-height:70vh;overflow-y:auto;margin:0 auto;padding:6px;}
  .li-lang{width:100%;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.55);color:#fff;font-family:inherit;font-size:1.12rem;padding:15px 10px;border-radius:13px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .18s ease,border-color .18s ease,transform .12s ease;}
  .li-lang:hover{background:rgba(255,255,255,.26);border-color:#fff;transform:translateY(-1px);}
  .li-seq{display:flex;flex-direction:column;align-items:center;gap:.28em;text-align:center;}
  .li-word{color:#fff;font-family:"Gelasio",Georgia,serif;font-weight:600;font-size:clamp(2.4rem,8vw,5rem);line-height:1.1;opacity:0;transition:opacity .8s ease;}
  .li-word.show{opacity:1;}
  .li-ese-text{font-weight:900;font-size:clamp(2.9rem,10vw,6rem);line-height:1.05;margin-top:.12em;}
  .li-ese{opacity:0;transition:opacity 1.4s ease;z-index:3;pointer-events:none;}
  .li-ese.show{opacity:1;}
  .li-ese.fade-out{opacity:0;}
  .ctrans{background:none;border:none;color:var(--blue-dk);font-family:inherit;font-size:.8rem;font-weight:600;cursor:pointer;padding:2px 0;margin-top:2px;}
  [data-theme="dark"] .ctrans{color:var(--blue);}
  .ctrans:hover{text-decoration:underline;}
  /* analytics language bars */
  .lang-bars{display:flex;flex-direction:column;gap:10px;}
  .lang-bar-h{display:flex;justify-content:space-between;gap:10px;font-size:.88rem;margin-bottom:4px;align-items:center;}
  .lang-bar-meta{display:inline-flex;align-items:center;gap:8px;flex:none;}
  .lang-clear{background:none;border:none;cursor:pointer;color:var(--muted);font-size:1.1rem;line-height:1;padding:0 4px;border-radius:6px;flex:none;}
  .lang-clear:hover{color:#e0403a;background:rgba(224,64,58,.12);}
  .lang-bar-t{height:9px;background:var(--line);border-radius:100px;overflow:hidden;}
  .lang-bar-f{height:100%;background:linear-gradient(90deg,var(--green),var(--green-dk));border-radius:100px;}
  /* RTL niceties */
  [dir="rtl"] .wrap,[dir="rtl"] .view{text-align:right;}

  /* ===================== EARTH-ORBITS-THE-SUN LOADING SCREEN (theme-aware; orbit position = load progress) ===================== */
  #boot{position:fixed;inset:0;z-index:9500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
    background:radial-gradient(130% 100% at 50% 18%,#eef5ef 0%,#d5e3da 52%,#c2d7ca 100%);transition:opacity .55s ease;overflow:hidden;}
  [data-theme="dark"] #boot{background:radial-gradient(130% 100% at 50% 18%,#16232f 0%,#0e1720 55%,#080f16 100%);}
  #boot.done{opacity:0;pointer-events:none;}
  #boot .boot-solar{position:relative;width:236px;height:236px;}
  #boot .boot-path{position:absolute;inset:16px;border-radius:50%;border:1.5px dashed rgba(32,131,196,.30);}
  [data-theme="dark"] #boot .boot-path{border-color:rgba(92,179,234,.32);}
  #boot .boot-rays{position:absolute;top:50%;left:50%;width:156px;height:156px;margin:-78px 0 0 -78px;border-radius:50%;background:radial-gradient(circle,rgba(244,196,48,.45),rgba(244,196,48,0) 60%);animation:bootSunPulse 2.6s ease-in-out infinite;}
  #boot .boot-sun{position:absolute;top:50%;left:50%;width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;background:radial-gradient(circle at 40% 36%,#ffe9a3 0%,#f8d34e 42%,#f4c430 70%,#e3a51c 100%);box-shadow:0 0 0 2px rgba(244,196,48,.4),0 0 40px 12px rgba(244,196,48,.5);animation:bootSunPulse 2.6s ease-in-out infinite;}
  #boot .boot-orbit{position:absolute;inset:0;transform:rotate(0deg);will-change:transform;}

  #boot .boot-msg{font-family:"Gelasio","Gelasio",Georgia,serif;font-weight:900;font-size:1.55rem;color:#20302a;text-shadow:0 2px 14px rgba(0,0,0,.12);letter-spacing:.005em;}
  [data-theme="dark"] #boot .boot-msg{color:#f0f6ff;text-shadow:0 2px 18px rgba(0,0,0,.55);}
  #boot .boot-msg .sw{color:#2083c4;font-style:italic;font-weight:600;}
  [data-theme="dark"] #boot .boot-msg .sw{color:#8fd0ff;}
  #boot .boot-sub{font-size:.78rem;letter-spacing:.28em;text-transform:uppercase;color:#5f7168;}
  [data-theme="dark"] #boot .boot-sub{color:rgba(200,222,255,.72);}
  @keyframes bootFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
  @keyframes bootSpin{to{transform:rotate(360deg);}}
  @keyframes bootSunPulse{0%,100%{transform:scale(.97);}50%{transform:scale(1.06);}}
  @keyframes bootFill{from{transform:scaleX(0);}to{transform:scaleX(1);}}
  @keyframes bootBar{0%{transform:translateX(-160%);}100%{transform:translateX(420%);}}

  /* ===================== BUTTONS & CARDS: clean flat look + ripple micro-interaction ===================== */
  .ic{width:1em;height:1em;vertical-align:-.125em;flex:none;}
  .btn{position:relative;overflow:hidden;box-shadow:0 1px 3px rgba(20,48,42,.16);}

  /* ===================== REACTIVE BUTTONS + ICON BUTTONS ===================== */
  .btn{transition:transform .18s cubic-bezier(.34,1.56,.64,1),box-shadow .22s ease,background .2s,color .2s,border-color .2s,filter .2s;}   /* springy: a slight overshoot when it lifts */
  .btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(20,48,42,.2);filter:saturate(1.1);}
  .btn:active{transform:translateY(0) scale(.96);}
  .btn-primary::before,.btn-blue::before{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.4),transparent);transform:skewX(-18deg);transition:left .55s ease;pointer-events:none;}   /* a light sweep on hover */
  .btn-primary:hover::before,.btn-blue:hover::before{left:125%;}
  .iconbtn{transition:background .2s,border-color .2s,transform .28s cubic-bezier(.34,1.56,.64,1),box-shadow .28s;}
  .iconbtn svg{transition:transform .3s cubic-bezier(.34,1.56,.64,1);}
  .iconbtn:hover{transform:translateY(-1px);box-shadow:0 6px 14px rgba(24,140,80,.28);}
  .iconbtn:hover svg{transform:rotate(-10deg) scale(1.14);}
  .iconbtn:active{transform:scale(.9);}
  .tabs button{transition:background .16s,color .2s,box-shadow .18s,transform .18s cubic-bezier(.34,1.56,.64,1);}
  .tabs button:not(.active):hover{transform:translateY(-1px) scale(1.04);}
  .gfilter-b{transition:transform .16s cubic-bezier(.34,1.56,.64,1),border-color .18s,color .18s,background .18s;}
  .gfilter-b:hover{transform:translateY(-2px);}
  .gfilter-b.on{transform:none;}
  .btn:active{transform:none!important;box-shadow:0 1px 2px rgba(20,48,42,.2);}
  [data-theme="dark"] .btn-ghost{background:rgba(255,255,255,.05);}
  .ripple{position:absolute;border-radius:50%;background:rgba(128,128,128,.4);transform:scale(0);animation:ripple .55s ease-out forwards;pointer-events:none;}
  @keyframes ripple{to{transform:scale(1);opacity:0;}}
  .rx-chip{transition:transform .15s;}
  .rx-chip:active{transform:scale(1.15);}
  .rx-chip.pop{animation:chippop .32s ease;}
  @keyframes chippop{0%{transform:scale(1);}45%{transform:scale(1.22);}100%{transform:scale(1);}}

  /* ===================== REAL FILE BUTTONS (not the device default) ===================== */
  .filebtn{display:inline-flex;align-items:center;gap:9px;cursor:pointer;user-select:none;}
  .filebtn input[type="file"]{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);border:0;}   /* visually hidden but still keyboard-focusable */
  .filebtn:focus-within{outline:3px solid rgba(24,140,80,.4);outline-offset:2px;}

  /* ===================== LEAF CONFETTI ===================== */
  .leafconf{position:absolute;top:-34px;width:15px;height:15px;border-radius:0 62% 0 62%;opacity:0;animation:leafFall 2.8s cubic-bezier(.3,.4,.6,1) forwards;}
  @keyframes leafFall{0%{transform:translate(0,-40px) rotate(0deg);opacity:0;}
    10%{opacity:.95;}
    55%{transform:translate(calc(var(--dx)*.5),52vh) rotate(calc(var(--rot)*.55));}
    100%{transform:translate(var(--dx),104vh) rotate(var(--rot));opacity:0;}}

  /* ===================== NOTIFICATION BELL (leaf badge) ===================== */
  .bellbtn{position:relative;}
  .bellbtn .beli{width:20px;height:20px;transform-origin:top center;}
  .bellbtn:hover .beli{animation:bellRing .7s ease;}
  @keyframes bellRing{0%,100%{transform:rotate(0);}15%{transform:rotate(26deg);}30%{transform:rotate(-20deg);}45%{transform:rotate(14deg);}60%{transform:rotate(-9deg);}80%{transform:rotate(4deg);}}
  .leafbadge{position:absolute;top:-2px;right:-4px;width:19px;height:19px;display:flex;align-items:center;justify-content:center;background:linear-gradient(140deg,#37a75e,#146639);border-radius:100% 0 100% 0;transform:rotate(45deg);box-shadow:0 1px 5px rgba(0,0,0,.3);animation:badgePop .5s cubic-bezier(.16,.8,.32,1);}
  .leafbadge b{transform:rotate(-45deg);color:#fff;font-size:.6rem;line-height:1;font-weight:700;}
  @keyframes badgePop{from{transform:rotate(45deg) scale(0);}to{transform:rotate(45deg) scale(1);}}

  /* ===================== COMMAND PALETTE (Ctrl+K) ===================== */
  .cpal{position:fixed;inset:0;z-index:340;background:rgba(10,22,16,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:flex-start;justify-content:center;padding:13vh 16px 16px;}
  .cpal-card{width:100%;max-width:560px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.4);overflow:hidden;animation:cpalIn .22s cubic-bezier(.16,.8,.32,1);}
  @keyframes cpalIn{from{opacity:0;transform:translateY(-14px) scale(.97);}to{opacity:1;transform:none;}}
  .cpal-row{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);color:var(--green);}
  .cpal-row svg{width:20px;height:20px;flex:none;}
  .cpal-in{flex:1;border:none;background:transparent;color:var(--ink);font-family:inherit;font-size:.92rem;outline:none;}
  .cpal-k{font-size:.68rem;background:var(--line);color:var(--muted);padding:3px 8px;border-radius:6px;flex:none;}
  .cpal-list{max-height:320px;overflow:auto;padding:8px;}
  .cpal-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:none;padding:10px 12px;border-radius:10px;cursor:pointer;color:var(--ink);font-family:inherit;font-size:.95rem;transition:background .14s,transform .14s;}
  .cpal-item svg{width:17px;height:17px;color:var(--green);flex:none;}
  .cpal-item.on,.cpal-item:hover{background:rgba(0,118,0,.1);}
  .cpal-item.on{transform:translateX(3px);}
  .cpal-go{margin-left:auto;font-size:.75rem;color:var(--muted);opacity:0;transition:opacity .15s;}
  .cpal-item.on .cpal-go{opacity:1;}
  .cpal-none{padding:22px;text-align:center;color:var(--muted);}
  .cpal-foot{padding:9px 16px;border-top:1px solid var(--line);font-size:.72rem;color:var(--muted);}
  [data-theme="dark"] .cpal-item.on,[data-theme="dark"] .cpal-item:hover{background:rgba(73,183,110,.16);}

  /* ===================== HOMEPAGE: SUN RAYS + BUTTERFLIES + FIREFLIES ===================== */
  .sun-wrap .sun-rays{position:absolute;left:50%;top:50%;width:340px;height:340px;margin:-170px 0 0 -170px;border-radius:50%;pointer-events:none;
    background:repeating-conic-gradient(rgba(255,205,80,.2) 0deg 7deg,transparent 7deg 22deg);
    -webkit-mask-image:radial-gradient(circle,#000 0%,transparent 66%);mask-image:radial-gradient(circle,#000 0%,transparent 66%);
    animation:sunRays 32s linear infinite;}
  @keyframes sunRays{to{transform:rotate(360deg);}}
  .bfly{position:absolute;top:0;left:0;width:30px;height:26px;z-index:6;pointer-events:none;animation:bflyFly var(--dur,12s) linear forwards;}
  .bfly svg{width:100%;height:100%;display:block;}
  .bfly .bw{transform-origin:16px 13px;animation:bflyFlap .3s ease-in-out infinite alternate;}
  @keyframes bflyFlap{from{transform:scaleX(1);}to{transform:scaleX(.32);}}
  @keyframes bflyFly{0%{transform:translate(-46px,var(--y0));}
    25%{transform:translate(26vw,calc(var(--y0) - 34px));}
    50%{transform:translate(52vw,calc(var(--y0) + 20px));}
    75%{transform:translate(78vw,calc(var(--y0) - 38px));}
    100%{transform:translate(106vw,var(--y0));}}
  .bfly-rev{animation-direction:reverse;}
  .bfly-rev svg{transform:scaleX(-1);}
  .ffly{position:absolute;width:5px;height:5px;border-radius:50%;background:#ffe36b;box-shadow:0 0 8px 2px rgba(255,216,90,.85),0 0 16px 6px rgba(255,198,70,.3);z-index:6;pointer-events:none;opacity:0;
    animation:fflyDrift var(--dur,8s) ease-in-out infinite alternate, fflyBlink var(--blinkdur,2.8s) ease-in-out infinite;}
  @keyframes fflyDrift{from{transform:translate(0,0);}to{transform:translate(var(--dx,20px),var(--dy,-12px));}}
  @keyframes fflyBlink{0%,100%{opacity:.04;}22%{opacity:.09;}48%{opacity:var(--peak,.95);}60%{opacity:.2;}78%{opacity:calc(var(--peak,.95)*.6);}}
  .card{transition:transform .18s ease,box-shadow .18s ease;}
  .card:hover{transform:translateY(-3px);box-shadow:0 14px 32px rgba(20,48,42,.12);}
  [data-theme="dark"] .card:hover{box-shadow:0 14px 32px rgba(0,0,0,.42);}
  .modal-card:hover{transform:none;}

  /* ===================== TOP BAR: frosted glass with raised active pill ===================== */
  .topbar{background:rgba(244,212,98,.88);backdrop-filter:blur(14px) saturate(1.35);-webkit-backdrop-filter:blur(14px) saturate(1.35);border-bottom:1px solid rgba(0,0,0,.08);box-shadow:0 2px 16px rgba(64,48,10,.16);}
  [data-theme="dark"] .topbar{background:rgba(58,27,9,.85);border-bottom:1px solid rgba(0,0,0,.35);box-shadow:0 2px 16px rgba(0,0,0,.4);}
  .tabs button{border-radius:10px;padding:7px 13px;transition:background .16s,color .2s,box-shadow .18s;}
  .tabs button.active{background:#fff;color:var(--green);border-bottom-color:transparent;font-weight:600;box-shadow:0 2px 8px rgba(64,48,10,.18);}
  [data-theme="dark"] .tabs button.active{background:rgba(255,255,255,.12);color:var(--green);box-shadow:0 2px 8px rgba(0,0,0,.3);}
  .tabs button.admin.active{background:#fff;color:var(--blue);box-shadow:0 2px 8px rgba(24,96,152,.22);}
  [data-theme="dark"] .tabs button.admin.active{background:rgba(255,255,255,.12);color:var(--blue);}

  /* ===================== HOMEPAGE: rotating globe + soft wordmark shadow ===================== */
  .wordmark{text-shadow:0 2px 4px rgba(255,255,255,.35),0 6px 18px rgba(0,70,0,.22);}
  [data-theme="dark"] .hero-content .wordmark{text-shadow:0 2px 14px rgba(0,0,0,.55);}
  .hero-globe{width:clamp(84px,12vw,116px);height:clamp(84px,12vw,116px);position:relative;margin:0 auto 12px;animation:bootFloat 5s ease-in-out infinite;filter:drop-shadow(0 14px 26px rgba(10,40,20,.35));}
  .hero-globe .hg-earth{position:absolute;inset:0;border-radius:50%;overflow:hidden;
    background:radial-gradient(circle at 34% 30%,#63b489 0%,#2e8f52 40%,#14663a 78%,#0a3d24 100%);
    box-shadow:inset -10px -9px 20px rgba(0,10,5,.55),inset 5px 4px 13px rgba(255,255,255,.25),0 0 0 2px rgba(255,255,255,.55),0 0 0 6px rgba(255,255,255,.16);}

    background-size:232px 128px;background-repeat:repeat-x;}
  .hero-globe .hg-shade{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 30% 26%,rgba(255,255,255,.5),transparent 46%),radial-gradient(circle at 76% 78%,rgba(0,8,4,.5),transparent 58%);}
  .hero-globe .hg-clouds{position:absolute;inset:0;animation:hgSpin 11s linear infinite;opacity:.5;
    background-image:radial-gradient(11px 3px at 18px 20px,#fff 98%,transparent 100%),radial-gradient(9px 2.5px at 40px 44px,#fff 98%,transparent 100%),radial-gradient(12px 3px at 8px 60px,#fff 98%,transparent 100%);
    background-size:64px 84px;background-repeat:repeat-x;}
  @keyframes hgSpin{from{transform:translateX(0);}to{transform:translateX(-232px);}}
  [data-theme="dark"] .hero-globe{filter:drop-shadow(0 14px 26px rgba(0,0,0,.5));}
  [data-theme="dark"] .hero-globe .hg-earth{background:radial-gradient(circle at 34% 30%,#3f8f63 0%,#1d6b3e 42%,#0c4327 80%,#062a19 100%);box-shadow:inset -10px -9px 20px rgba(0,0,0,.7),inset 5px 4px 13px rgba(255,255,255,.14),0 0 0 2px rgba(180,230,200,.4),0 0 26px 4px rgba(64,180,120,.35);}
  [data-theme="dark"] .hero .trunk{fill:var(--night-trunk,#41301f);}
  [data-theme="dark"] .hero .bark{stroke:var(--night-trunk,#41301f);}

  /* ===================== SKELETON LOADERS ===================== */
  .skl{background:linear-gradient(100deg,var(--line) 30%,var(--bg) 50%,var(--line) 70%);background-size:200% 100%;animation:skl 1.25s linear infinite;border-radius:12px;}
  @keyframes skl{from{background-position:130% 0;}to{background-position:-70% 0;}}
  .skl-card{height:112px;}
  .skl-line{height:16px;margin:12px 0;}
  .skl-title{height:22px;width:40%;margin:6px 0 18px;}

  /* ===================== ANALYTICS: SPARKLINES ===================== */
  .stat-card .spark{width:100%;height:30px;margin-top:10px;display:block;}

  /* ===================== CHAPTER WORLD MAP ===================== */
  .wmap-card{padding:0;overflow:hidden;}
  .wmap-head{padding:18px 20px 12px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .wmap{position:relative;width:100%;background:linear-gradient(180deg,#e9f4ee,#ddeee6);}
  [data-theme="dark"] .wmap{background:linear-gradient(180deg,#0c1a24,#0a1420);}
  .wmap svg{display:block;width:100%;height:auto;}
  .wmap .land{fill:var(--green);opacity:.5;}
  [data-theme="dark"] .wmap .land{opacity:.6;}
  .wmap .pin{fill:#e0403a;stroke:#fff;stroke-width:.8;cursor:pointer;}
  .wmap .pin-ring{fill:none;stroke:#e0403a;stroke-width:.5;animation:wmpulse 2.2s ease-out infinite;}
  .wmap .arc{fill:none;stroke:rgba(18,110,58,.55);stroke-width:.55;stroke-linecap:round;stroke-dasharray:2.2 1.6;animation:arcFlow 1.7s linear infinite;}
  [data-theme="dark"] .wmap .arc{stroke:rgba(102,205,153,.6);}
  @keyframes arcFlow{to{stroke-dashoffset:-3.8;}}   /* the dashes crawl from HQ outward along each arc */
  @keyframes wmpulse{0%{r:1.6;opacity:.6;}70%,100%{r:3.6;opacity:0;}}
  .wmap-legend{display:flex;gap:16px;align-items:center;padding:10px 20px 14px;font-size:.82rem;color:var(--muted);flex-wrap:wrap;}
  .wmap-legend .dotk{display:inline-block;width:9px;height:9px;border-radius:50%;background:#e0403a;margin-right:6px;}

  /* ===================== EMPTY STATES WITH ARTWORK ===================== */
  .empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:42px 20px 34px;}
  .empty-art{position:relative;width:120px;height:120px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:18px;
    background:radial-gradient(circle at 50% 42%,rgba(0,118,0,.14),rgba(0,118,0,.05) 70%);border:1px dashed var(--line);}
  .empty-art svg{width:62px;height:62px;color:var(--green);}
  .empty h3{font-size:1.25rem;margin-bottom:6px;color:var(--green);}
  .empty p{color:var(--muted);max-width:46ch;margin:0 0 14px;}
  .empty-sm{padding:22px 10px 18px;}
  .empty-sm .empty-art{width:84px;height:84px;margin-bottom:10px;}
  .empty-sm .empty-art svg{width:44px;height:44px;}
  .empty-sm h3{font-size:1.05rem;margin-bottom:4px;}
  .empty-sm p{font-size:.88rem;margin:0;}

  /* ===================== GALLERY LIGHTBOX (full page, blurred backdrop) ===================== */
  .lbx{position:fixed;inset:0;z-index:320;display:none;align-items:center;justify-content:center;}
  .lbx-bg{position:absolute;inset:-60px;background-size:cover;background-position:center;filter:blur(32px) saturate(1.15);opacity:.55;transform:scale(1.06);}
  .lbx-dim{position:absolute;inset:0;background:rgba(6,14,10,.45);}
  .lbx img{position:relative;max-width:92vw;max-height:86vh;border-radius:14px;border:4px solid #fff;box-shadow:0 30px 90px rgba(0,0,0,.5);cursor:pointer;object-fit:contain;}
  .lbx img.lbx-in{animation:lbxIn .32s cubic-bezier(.16,.8,.32,1);}

  /* ===================== ROUND 6: GOOGLE-CLASSROOM TOP BAR + INFINITE-CAMPUS STYLE DRAWER ===================== */
  /* top bar: the original yellow, a normal hamburger on the left, icon buttons + profile on the right */
  .topbar .nav{gap:14px;min-height:56px;}

  .userbtn{display:inline-flex;align-items:center;gap:9px;background:transparent;border:none;border-radius:100px;padding:3px 11px 3px 3px;cursor:pointer;font-family:inherit;transition:background .18s;}

  /* the drawer: floating, rounded, soft gradient, slides in over the page (closed by default) */

  /* stacked toasts with icons */
  .toasts{position:fixed;top:14px;right:14px;display:flex;flex-direction:column;gap:8px;z-index:9200;pointer-events:none;max-width:min(340px,82vw);}
  .toast-item{display:flex;align-items:center;gap:10px;background:linear-gradient(180deg,#24352d,#1b2923);color:#f2f7f4;padding:10px 14px;border-radius:13px;box-shadow:0 12px 30px rgba(8,18,12,.4);border:1px solid rgba(255,255,255,.08);font-size:.88rem;font-weight:500;animation:toastIn .32s cubic-bezier(.16,.8,.32,1);}
  .toast-item .ti-ic{width:26px;height:26px;border-radius:9px;background:rgba(73,183,110,.22);color:#7fd99a;display:inline-flex;align-items:center;justify-content:center;flex:none;}

  @keyframes toastIn{from{opacity:0;transform:translateX(24px) scale(.96);}to{opacity:1;transform:none;}}

  /* back-to-top leaf button: grows as you scroll */
  .totop{position:fixed;right:16px;bottom:16px;width:47px;height:47px;border-radius:50%;border:none;cursor:pointer;background:linear-gradient(180deg,var(--green),var(--green-dk));color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px rgba(0,90,30,.35);opacity:0;pointer-events:none;transition:opacity .25s ease,filter .2s;z-index:600;transform-origin:50% 90%;}

  /* sticky mini-map of section anchors */

  /* gallery: filter chips with count badges + full-view button on tiles */
  .gfilter-b .gcnt{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:100px;font-size:.68rem;background:rgba(0,118,0,.14);color:var(--green);font-weight:700;line-height:1.5;}

  [data-theme="dark"] .gfilter-b.on .gcnt{color:#07130c;background:rgba(0,0,0,.2);}
  .gexp{position:absolute;right:9px;top:9px;width:30px;height:30px;border-radius:10px;border:none;cursor:pointer;background:rgba(10,25,16,.55);color:#fff;display:inline-flex;align-items:center;justify-content:center;opacity:0;transition:opacity .18s,transform .18s,background .18s;backdrop-filter:blur(4px);z-index:3;}

  /* member-since badge on comment cards */
  .ms-badge{display:inline-flex;align-items:center;gap:3px;font-size:.62rem;font-weight:700;color:var(--green);background:rgba(0,118,0,.1);border-radius:100px;padding:1px 7px;letter-spacing:.02em;}
  .ms-badge svg{width:10px;height:10px;}
  [data-theme="dark"] .ms-badge{background:rgba(73,183,110,.14);}
  /* richer member profile card */
  .mp-badge{display:inline-flex;align-items:center;font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:100px;background:rgba(0,118,0,.12);color:var(--green);}
  .mp-badge.ad{background:rgba(32,131,196,.13);color:var(--blue);}
  .mp-badge.ow{background:linear-gradient(90deg,#f7c948,#f4a612);color:#4a3200;}
  .mp-since{display:inline-flex;align-items:center;gap:6px;margin-top:9px;font-size:.76rem;color:var(--muted);background:var(--bg);border:1px dashed var(--line);padding:4px 11px;border-radius:100px;}
  .mp-since svg{width:13px;height:13px;color:var(--green);}
  .mp-stats{display:flex;gap:8px;margin-top:14px;}

  .mp-stat b{display:block;font-size:1.05rem;color:var(--green);}

  /* ===================== 2.8: announcement banner, leader chat, developer dashboard, name colors ===================== */
  .annbar{display:flex;align-items:center;gap:12px;background:#0a4d0a;color:#fff;padding:10px 18px;font-size:.92rem;font-weight:500;}
  .annbar span{flex:1;text-align:center;}

  .ld-card{padding:18px 18px 16px;display:flex;flex-direction:column;height:calc(100vh - 240px);min-height:500px;}
  .ld-list{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:4px 2px;scroll-behavior:smooth;}
  .ld-shell{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:16px;align-items:stretch;}

  .ld-msg{display:flex;gap:10px;align-items:flex-start;}

  .ld-bubble.mine{background:var(--card);border-color:var(--line);}   /* own messages are plain white, never tinted */

  .ld-bubble:hover .ld-acts,.ld-acts:focus-within{opacity:1;}
  @media(hover:none){.ld-acts{opacity:1;}.ld-rxadd{display:flex !important;}}

  .ld-act:hover{color:var(--green);}

  .ld-rxrow{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;}
  .ld-rx{border:1px solid var(--line);background:var(--card);border-radius:100px;font-size:.9rem;padding:2px 9px;cursor:pointer;font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji","Segoe UI",system-ui,sans-serif;line-height:1.5;}
  .ld-rx.on{border-color:var(--green);background:rgba(0,118,0,.1);font-weight:600;}
  .ld-rxadd{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap;min-height:30px;align-items:center;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .14s ease,visibility .14s ease;}
  .ld-bubble:hover .ld-rxadd,.ld-bubble:focus-within .ld-rxadd{opacity:1;visibility:visible;pointer-events:auto;}
  .ld-rxaddbtn{border:1px solid var(--line);background:var(--card);border-radius:100px;cursor:pointer;font-size:1rem;padding:2px 7px;line-height:1.3;opacity:.82;font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji","Segoe UI",system-ui,sans-serif;transition:opacity .14s,border-color .14s;}
  .ld-rxaddbtn:hover{opacity:1;border-color:var(--green);}
  @media(hover:none){.ld-rxadd{opacity:1;visibility:visible;pointer-events:auto;}}
  .ld-replying{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted);margin-top:10px;border-top:1px dashed var(--line);padding-top:8px;}
  .ld-replying .ic{width:.85em;height:.85em;}
  .ld-side{padding:14px 14px 10px;display:flex;flex-direction:column;min-height:0;}
  .ld-side h3{font-size:1rem;margin:0 0 2px;}
  .ld-side .sub{font-size:.78rem;color:var(--muted);margin:0 0 10px;}
  .ld-peep{display:flex;gap:9px;align-items:center;padding:7px 4px;border-bottom:1px solid var(--line);}
  .ld-peep:last-child{border-bottom:none;}
  .ld-pav{width:30px;height:30px;border-radius:50%;object-fit:cover;flex:none;background:var(--green);color:#fff!important;-webkit-text-fill-color:#fff!important;text-shadow:none!important;filter:none!important;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1;font-size:.85rem;}
  .ld-peep .who{flex:1;min-width:0;}
  .ld-peep b{font-size:.88rem;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ld-peep .rl{font-size:.72rem;color:var(--muted);}
  .ld-side .mp-status{margin-top:0;font-size:.74rem;}
  .ld-side .mp-on i,.ld-side .mp-off i{width:7px;height:7px;box-shadow:0 0 0 2px rgba(0,118,0,.15);}
  .dev-kv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:.9rem;}
  .dev-kv:last-child{border-bottom:none;}
  .dev-kv b{color:var(--green);font-weight:700;}
  .nc-row{display:flex;gap:14px;flex-wrap:wrap;padding:6px 0 4px;}
  .nc-dot{width:34px;height:34px;border-radius:50%;border:none;box-shadow:0 0 0 1.5px var(--line);cursor:pointer;padding:0;transition:transform .15s,box-shadow .15s;}
  .nc-black{color:#20302a;} .nc-blue{color:#2083C4;} .nc-red{color:#c0392b;} .nc-purple{color:#7c3aed;} .nc-turquoise{color:#0e9488;} .nc-darkred{color:#7f1d1d;} .nc-green{color:#007600;} .nc-darkorange{color:#b45309;}
  .nc-pink{color:#d6336c;} .nc-magenta{color:#a21caf;} .nc-rose{color:#be123c;} .nc-orange{color:#ea580c;} .nc-gold{color:#ca8a04;} .nc-lime{color:#65a30d;} .nc-cyan{color:#0891b2;} .nc-skyblue{color:#0ea5e9;} .nc-navy{color:#1e3a8a;} .nc-indigo{color:#4f46e5;} .nc-brown{color:#78350f;} .nc-gray{color:#5f6b7a;}
  [data-theme="dark"] .nc-black{color:#e7eef3;} [data-theme="dark"] .nc-blue{color:#5cb3ea;} [data-theme="dark"] .nc-red{color:#ff8a7a;} [data-theme="dark"] .nc-purple{color:#b79df5;} [data-theme="dark"] .nc-turquoise{color:#2dd4bf;} [data-theme="dark"] .nc-darkred{color:#d98880;} [data-theme="dark"] .nc-green{color:#49b76e;} [data-theme="dark"] .nc-darkorange{color:#f59e0b;}
  [data-theme="dark"] .nc-pink{color:#f783ac;} [data-theme="dark"] .nc-magenta{color:#e879f9;} [data-theme="dark"] .nc-rose{color:#fb7185;} [data-theme="dark"] .nc-orange{color:#fb923c;} [data-theme="dark"] .nc-gold{color:#facc15;} [data-theme="dark"] .nc-lime{color:#a3e635;} [data-theme="dark"] .nc-cyan{color:#22d3ee;} [data-theme="dark"] .nc-skyblue{color:#38bdf8;} [data-theme="dark"] .nc-navy{color:#93c5fd;} [data-theme="dark"] .nc-indigo{color:#818cf8;} [data-theme="dark"] .nc-brown{color:#c8a06e;} [data-theme="dark"] .nc-gray{color:#94a3b8;}
  .nc-dot:hover{transform:scale(1.12);}
  .nc-dot.on{box-shadow:0 0 0 3px var(--green);}
  .mp-status{margin-top:10px;font-size:.85rem;font-weight:600;}
  .mp-on{color:var(--green);display:inline-flex;align-items:center;gap:7px;}
  .mp-on i{width:9px;height:9px;border-radius:50%;background:var(--green);display:inline-block;box-shadow:0 0 0 3px rgba(0,118,0,.18);}
  .mp-off{color:var(--muted);display:inline-flex;align-items:center;gap:7px;}
  .mp-off i{width:9px;height:9px;border-radius:50%;background:var(--muted);display:inline-block;opacity:.55;}
  /* team card skeleton */
  .team-skl-av{width:74px;height:74px;border-radius:50%;margin:0 auto 12px;}
  /* ===================== 2.7 ADDITIONS: offline chip, password meter, tour, changelog reorder, image zoom ===================== */
  /* 2.7.1: avatar letters are ALWAYS pure white, on a deep green circle in both themes (in dark mode the green used to wash out) */
  .avatar,.cinit,.mp-init,.pc-noimg,.pf-ava{color:#fff;}
  .avatar .av-letter,.ld-pav .av-letter,.cinit .av-letter{color:#fff!important;-webkit-text-fill-color:#fff!important;text-shadow:none!important;filter:none!important;font-size:.78em;font-weight:700;line-height:1;}
  [data-theme="dark"] .avatar,[data-theme="dark"] .cinit,[data-theme="dark"] .pc-noimg,[data-theme="dark"] .pc-pic,[data-theme="dark"] .pf-ava{background:#0e6b33;}
  [data-theme="dark"] .mp-init{background:linear-gradient(180deg,#0e6b33,#0a5026);}
  /* connection status chip (offline / connecting / connected) */
  .netchip{position:fixed;top:14px;left:50%;transform:translateX(-50%) translateY(-70px);z-index:9300;display:flex;align-items:center;gap:9px;padding:9px 17px;border-radius:100px;font-size:.85rem;font-weight:600;color:#fff;background:linear-gradient(180deg,#c74b40,#a5301f);box-shadow:0 10px 26px rgba(120,20,10,.4);transition:transform .3s cubic-bezier(.16,.8,.32,1);pointer-events:none;}
  .netchip.show{transform:translateX(-50%) translateY(0);}
  .netchip .nd{width:9px;height:9px;border-radius:50%;background:#ffd7d3;animation:netPulse 1.2s ease-in-out infinite;}
  .netchip.connecting{background:linear-gradient(180deg,#c98a1e,#a86f0d);}
  .netchip.connecting .nd{background:#ffe9bf;}
  .netchip.connected{background:linear-gradient(180deg,#2f9e57,#14663a);}
  .netchip.connected .nd{background:#c9f5d6;animation:none;}
  @keyframes netPulse{0%,100%{opacity:.45;}50%{opacity:1;}}
  /* password strength meter */
  .pw-meter{display:flex;flex-direction:column;gap:5px;margin:2px 0 12px;}
  .pw-track{width:100%;height:7px;border-radius:100px;background:rgba(120,120,120,.18);overflow:hidden;}
  .pw-fill{height:100%;width:0;border-radius:100px;background:#d0463b;transition:width .25s ease,background .25s ease;}
  .pw-fill.w1{width:20%;background:#d0463b;}
  .pw-fill.w2{width:45%;background:#e8963c;}
  .pw-fill.w3{width:72%;background:#d9b23c;}
  .pw-fill.w4{width:100%;background:linear-gradient(90deg,#37a75e,#146639);}
  .pw-row{display:flex;justify-content:space-between;font-size:.76rem;color:var(--muted);}
  .pw-label{font-weight:700;}
  .pw-label.weak{color:#d0463b;} .pw-label.medium{color:#c98a1e;} .pw-label.strong{color:#37a75e;}

  .fld-hint.bad{color:#d0463b;}
